<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
  <title>rainfall | hikki photography</title>
  <meta name="robots" content="noindex"/>
  <meta name="theme-color" content="#0b0705"/>
  <link rel="icon" href="/favicon.png" type="image/png"/>
  <link rel="stylesheet" href="site.css?v=17"/>
  <script src="site.js?v=17" defer></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    :root{
      --ink:#0b0705;
      --amb:#e74c3c;
      --amb-hair:rgba(231,76,60,.22);
      --f-num:'Share Tech Mono', "Courier New", monospace;
      --panel:210px;                 /* 左上讀數欄統一闊度 */
    }
    html, body{ height:100%; background:var(--ink); color:var(--amb);
      overflow:hidden; -webkit-text-size-adjust:100%; }
    body{ font-family:var(--f-num); }

    /* header：更透明 + 橙色字符 */
    .hk-bar{ background:rgba(11,7,5,.34) !important;
      -webkit-backdrop-filter:blur(10px) saturate(1.1); backdrop-filter:blur(10px) saturate(1.1);
      color:var(--amb) !important; }
    .hk-bar .hk-rotator, .hk-bar .hk-menu-btn, .hk-bar .hk-logo{ color:var(--amb) !important; }
    .hk-bar .hk-logo .hk-sq{ background:var(--amb) !important; }
    .hk-bar .hk-menu-btn:hover{ color:#ff8a72 !important; }

    /* ===== rain 專屬 menu 配色：暗油墨底 + 橙字（同城市圖同一語言） ===== */
    .hk-menu{
      background:rgba(11,7,5,.93) !important;
      -webkit-backdrop-filter:blur(14px) saturate(1.1) !important;
      backdrop-filter:blur(14px) saturate(1.1) !important;
      color:var(--amb) !important;
    }
    .hk-menu-list li{ border-bottom-color:rgba(231,76,60,.26) !important; }
    .hk-menu-list a, .hk-menu-list button{ color:var(--amb) !important; }
    .hk-menu-list a:hover, .hk-menu-list button:hover{ color:#ffb3a2 !important; }
    .hk-menu-contact .hk-contact-head{ color:var(--amb) !important; }
    .hk-menu-contact li, .hk-menu-contact a{ color:rgba(231,76,60,.78) !important; }
    .hk-menu-contact a:hover{ border-bottom-color:#ffb3a2 !important; color:#ffb3a2 !important; }
    .hk-menu-contact a.hk-enq{ color:#ff8a72 !important; }
    .hk-menu-geo{ color:rgba(231,76,60,.6) !important; }
    .hk-menu-geo .hk-geo-loc{ color:var(--amb) !important; }
    .hk-menu-copy{ color:rgba(231,76,60,.66) !important;
      border-top-color:rgba(231,76,60,.26) !important; }
    /* about 面板：同套暖色 */
    .hk-about{ background:rgba(11,7,5,.9) !important; color:rgba(255,214,204,.92) !important; }
    .hk-about-close{ color:var(--amb) !important; }
    .hk-about-close:hover{ color:#ffb3a2 !important; }
    .hk-about-foot{ color:rgba(231,76,60,.72) !important;
      border-top-color:rgba(231,76,60,.2) !important; }

    canvas{ position:fixed; inset:0; width:100%; height:100%; display:block; }
    #city{ z-index:0; cursor:grab; touch-action:none; }
    #city.drag{ cursor:grabbing; }
    #wx{ z-index:1; pointer-events:none; }

    /* 全頁調光：grain/vignette 減弱 */
    .grain{ position:fixed; inset:0; z-index:2; pointer-events:none;
      background: repeating-linear-gradient(0deg, rgba(0,0,0,.18) 0 1px, transparent 1px 3px);
      mix-blend-mode:multiply; }
    .vig{ position:fixed; inset:0; z-index:2; pointer-events:none;
      background: radial-gradient(120% 90% at 50% 45%, transparent 46%, rgba(11,7,5,.58) 100%); }

    .hud{ position:fixed; z-index:4; pointer-events:none;
      font-size:11px; letter-spacing:.14em; line-height:1.85; color:var(--amb); }

    /* 左上：時間／座標／aerial view */
    .hud-head{ top:calc(var(--hk-bar-h) + clamp(10px,2vh,22px)); left:clamp(14px,3vw,38px);
      width:var(--panel); }
    .hud-head .t{ font-family:var(--hk-font-sans); font-weight:700;
      font-size:34px; letter-spacing:-0.01em; line-height:1; color:var(--amb);
      font-variant-numeric:tabular-nums; }
    .hud-head .c{ margin-top:5px; font-size:11px; color:rgba(231,76,60,.62); white-space:nowrap; }

    /* 右上：讀數 */
    .hud-read{ top:calc(var(--hk-bar-h) + clamp(10px,2vh,22px)); right:clamp(14px,3vw,38px);
      text-align:right; min-width:176px; }
    .hud-read .row{ display:flex; justify-content:flex-end; gap:12px; }
    .hud-read .k{ color:rgba(231,76,60,.45); }
    .hud-read .v{ min-width:74px; text-align:right; color:var(--amb); }
    .hud-read .big{ font-family:var(--hk-font-sans); font-weight:700;
      font-size:28px; line-height:1.1; letter-spacing:-0.01em; margin:2px 0 6px; }
    .hud-read .sep{ height:1px; width:118px; margin:7px 0 7px auto; background:var(--amb-hair); }
    .hud-read .zone{ font-size:10.5px; color:rgba(231,76,60,.7); letter-spacing:.1em; min-height:1em; }

    /* 左下：狀態 */
    .hud-foot{ bottom:clamp(40px,6vh,56px); left:clamp(14px,3vw,38px); }
    .site-copy{ position:fixed; z-index:4; left:clamp(14px,3vw,38px); bottom:12px;
      font-size:10px; letter-spacing:.1em; color:rgba(231,76,60,.4); }

    /* STATION + ARCHIVE：桌面右下（向上展開）／手機右上（向下展開）
       桌面視覺（上→下）：staList、STATION、archList、ARCHIVE */
    .ctl{ position:fixed; z-index:6; right:clamp(14px,3vw,38px); bottom:clamp(12px,3vh,20px);
      display:flex; flex-direction:column; align-items:flex-end; gap:4px; }
    .ctl button{ appearance:none; background:none; border:0; cursor:pointer;
      font-family:var(--f-num); font-size:11px; letter-spacing:.18em;
      color:rgba(231,76,60,.62); padding:3px 0; text-align:right;
      border-bottom:1px solid transparent; transition:color .2s, border-color .2s;
      touch-action:manipulation; }
    .ctl button:hover, .ctl button.on{ color:var(--amb); border-bottom-color:var(--amb); }
    .ctl .list{ display:none; flex-direction:column; align-items:flex-end; gap:3px;
      margin-bottom:4px; }
    .ctl .list.open{ display:flex; }
    .ctl .list button{ font-size:10.5px; letter-spacing:.05em; padding:2px 0;
      opacity:0; transform:translateY(7px) scaleY(.5); transform-origin:bottom;
      transition:opacity .16s ease, transform .16s ease,
                 color .2s, border-color .2s; }
    .ctl .list button.in{ opacity:1; transform:none; }

    .boot{ position:fixed; inset:0; z-index:9; display:flex; align-items:center; justify-content:center;
      background:var(--ink); transition:opacity .6s ease;
      font-size:11px; letter-spacing:.34em; color:rgba(231,76,60,.6); text-align:center; }
    .boot.off{ opacity:0; pointer-events:none; }
    .boot .bc{ margin-top:10px; font-size:10.5px; letter-spacing:.2em;
      color:rgba(231,76,60,.4); }

    @media (max-width:767px){
      :root{ --panel:168px; }
      .hud-head .t{ font-size:27px; }
      .hud-read{ top:auto; bottom:calc(clamp(12px,3vh,20px) + 62px); right:clamp(14px,3vw,38px); }
      .hud-foot{ bottom:calc(clamp(12px,3vh,20px) + 26px); }
      /* 選單移到右上，同時鐘相對；向下展開
         手機視覺（上→下）：STATION、staList、ARCHIVE、archList */
      .ctl{ top:calc(var(--hk-bar-h) + clamp(10px,2vh,22px)); bottom:auto; }
      .ctl .list{ margin-bottom:0; margin-top:2px; }
      .ctl .list button{ transform:translateY(-7px) scaleY(.5); transform-origin:top; }
      .ctl .list button.in{ transform:none; }
      #btnStation{ order:0; } #staList{ order:1; }
      #btnArchive{ order:2; } #archList{ order:3; }
    }
  </style>
</head>
<body>
  <canvas id="city"></canvas>
  <canvas id="wx"></canvas>
  <div class="grain"></div>
  <div class="vig"></div>
  <div class="boot" id="boot">
    <div>
      <div id="bootT">SURVEYING MACAU</div>
      <div class="bc" id="bootC">22.198510 | 113.536389</div>
    </div>
  </div>

  <div class="hud hud-head">
    <div class="t" id="hClock">--:--:--</div>
    <div class="c" id="hCoord">22.1930 | 113.5490</div>
  </div>

  <div class="hud hud-read">
    <div class="zone" id="rZone">MACAU</div>
    <div class="k" id="rState">reading…</div>
    <div class="big" id="rMm">--<span style="font-size:.4em"> MM/H</span></div>
    <div class="sep"></div>
    <div class="row"><span class="k">WND</span><span class="v" id="rWind">--</span></div>
    <div class="row"><span class="k">DIR</span><span class="v" id="rDir">--</span></div>
    <div class="row"><span class="k">GST</span><span class="v" id="rGust">--</span></div>

    <div class="sep"></div>
    <div class="row"><span class="k">TID</span><span class="v" id="rTide">--</span></div>
  </div>

  <div class="hud hud-foot" id="hFoot">—</div>
  <p class="site-copy">© 2026 hikki photography &amp; philosophy.</p>

  <div class="ctl">
    <div class="list" id="staList">
      <button data-z="aerial">▸ AERIAL</button>
      <button data-z="N.S. DE FÁTIMA">花地瑪 N.S. DE FÁTIMA</button>
      <button data-z="SANTO ANTÓNIO">花王 SANTO ANTÓNIO</button>
      <button data-z="SÃO LÁZARO">望德 SÃO LÁZARO</button>
      <button data-z="SÉ">大堂 SÉ</button>
      <button data-z="SÃO LOURENÇO">風順 SÃO LOURENÇO</button>
      <button data-z="N.S. DO CARMO">嘉模 N.S. DO CARMO</button>
      <button data-z="COTAI">路氹 COTAI</button>
      <button data-z="S. FRANCISCO XAVIER">聖方濟各 S. FRANCISCO XAVIER</button>
    </div>
    <button id="btnStation">STATION ▾</button>
    <div class="list" id="archList">
      <button data-d="live">▸ LIVE</button>
      <button data-d="2021-06-01">黑雨 BLACK RAIN 2021</button>
      <button data-d="2020-08-19">海高斯 HIGOS 2020</button>
      <button data-d="2018-09-16">山竹 MANGKHUT 2018</button>
      <button data-d="2017-08-23">天鴿 HATO 2017</button>
      <button data-d="2016-08-02">妮妲 NIDA 2016</button>
      <button data-d="2013-09-22">天兔 USAGI 2013</button>
      <button data-d="2012-07-24">韋森特 VICENTE 2012</button>
      <button data-d="2009-09-15">巨爵 KOPPU 2009</button>
      <button data-d="2008-09-24">黑格比 HAGUPIT 2008</button>
    </div>
    <button id="btnArchive">ARCHIVE ▾</button>
  </div>

  <script>
  (function(){
    var cityC=document.getElementById('city'), cx=cityC.getContext('2d');
    var wxC=document.getElementById('wx'), wc=wxC.getContext('2d');
    var W=0,H=0,DPR=1, MAP=null, S=10000;

    /* ===== 俯瞰視角 ===== */
    var view={ s:1, x:0, y:0, pitch:0.92, yaw:-0.35 };
    var base=1, ASPECT=1;
    var DEF={ s:1, x:0, y:0, pitch:0.92, yaw:-0.35 };   /* aerial view 原始視角 */
    var MAXZ=40, MINZ=0.7;
    var needDraw=false, NIGHT=false;

    function fit(){
      var r=cityC.getBoundingClientRect();
      DPR=Math.min(2, window.devicePixelRatio||1);
      W=Math.max(1,Math.floor(r.width)); H=Math.max(1,Math.floor(r.height));
      [cityC,wxC].forEach(function(c){ c.width=W*DPR; c.height=H*DPR;
        c.getContext('2d').setTransform(DPR,0,0,DPR,0,0); });
    }
    function resetView(){
      var bb=(MAP&&MAP.bbox)||[22.10,113.52,22.23,113.60];
      ASPECT=((bb[3]-bb[1])*Math.cos((bb[0]+bb[2])/2*Math.PI/180))/(bb[2]-bb[0]);
      base=Math.min(H*1.02,(W*1.02)/ASPECT);
      DEF={ s:1, x:W/2, y:H*0.52, pitch:0.92, yaw:-0.35 };
      view.s=DEF.s; view.x=DEF.x; view.y=DEF.y; view.pitch=DEF.pitch; view.yaw=DEF.yaw;
      targetS=view.s;
    }
    var sinP=0,cosP=1,sinY=0,cosY=1,HSCALE=1/14400;
    function updTrig(){
      sinP=Math.sin(view.pitch); cosP=Math.cos(view.pitch);
      sinY=Math.sin(view.yaw);   cosY=Math.cos(view.yaw);
    }
    function P(nx,ny,h){
      var X=(nx-0.5)*ASPECT, Y=(ny-0.5);
      var rx=X*cosY - Y*sinY, ry=X*sinY + Y*cosY;
      var z=(h||0)*HSCALE;
      var k=base*view.s;
      return [ view.x + rx*k, view.y + (ry*cosP - z*sinP)*k ];
    }
    /* 反投影（h=0 地面）：螢幕 → 地圖座標 */
    function invP(sx,sy){
      var k=base*view.s;
      var rx=(sx-view.x)/k, ryc=(sy-view.y)/k;
      var cp=Math.max(0.12,cosP);
      var ry=ryc/cp;
      var X=rx*cosY + ry*sinY, Y=-rx*sinY + ry*cosY;
      return [X/ASPECT+0.5, Y+0.5];
    }

    /* ===== 堂區／海域（葡文） ===== */
    /* min = 要幾大縮放先顯示（避免細 zoom 時標籤打交） */
    var ZONES=[
      { n:'N.S. DE FÁTIMA',      x:0.363, y:0.173, lat:22.2075, lon:113.5490, sea:false, min:1.0 },
      { n:'SANTO ANTÓNIO',       x:0.268, y:0.238, lat:22.1985, lon:113.5420, sea:false, min:1.9 },
      { n:'SÃO LÁZARO',          x:0.386, y:0.256, lat:22.1965, lon:113.5495, sea:false, min:1.9 },
      { n:'SÉ',                  x:0.318, y:0.292, lat:22.1930, lon:113.5450, sea:false, min:1.0 },
      { n:'SÃO LOURENÇO',        x:0.238, y:0.334, lat:22.1875, lon:113.5390, sea:false, min:1.9 },
      { n:'N.S. DO CARMO',       x:0.475, y:0.569, lat:22.1560, lon:113.5580, sea:false, min:1.0 },
      { n:'COTAI',               x:0.563, y:0.677, lat:22.1420, lon:113.5650, sea:false, min:1.0 },
      { n:'S. FRANCISCO XAVIER', x:0.525, y:0.831, lat:22.1220, lon:113.5620, sea:false, min:1.0 },
      { n:'PORTO INTERIOR',      x:0.150, y:0.269, lat:22.1950, lon:113.5320, sea:true,  min:1.0 },
      { n:'PORTO EXTERIOR',      x:0.487, y:0.300, lat:22.1930, lon:113.5576, sea:true,  min:1.5 },
      { n:'BAÍA DA PRAIA GRANDE',x:0.392, y:0.352, lat:22.1880, lon:113.5510, sea:true,  min:1.5 },
      { n:'RIO DAS PÉROLAS',     x:0.070, y:0.110, lat:22.2160, lon:113.5256, sea:true,  min:1.0 },
      { n:'MAR DA CHINA MERIDIONAL', x:0.820, y:0.815, lat:22.1240, lon:113.5856, sea:true, min:1.0 }
    ];
    var activeZone=null;

    /* ===== 夜間光照：每棟建築一個 glow 值 =====
       密度（26×26 格）^0.55 × 隨機 → 越密嘅城區越亮；賭場帶強制全亮 */
    var bBucket=null, bIdx=[[],[],[],[]];
    var CASINO=[ [0.495,0.585,0.075,0.100],    /* Cotai 金光大道 */
                 [0.315,0.265,0.130,0.090] ];  /* 新口岸／葡京一帶 */
    function hash01(i){ var x=Math.sin(i*127.1+311.7)*43758.5453; return x-Math.floor(x); }
    function prepGlow(){
      var B=MAP.buildings3d; if(!B) return;
      var G=26, grid=new Float32Array(G*G), n=B.length, i, gx, gy;
      for(i=0;i<n;i++){
        var f=B[i][1];
        gx=Math.min(G-1,Math.max(0,(f[0]/S*G)|0));
        gy=Math.min(G-1,Math.max(0,(f[1]/S*G)|0));
        grid[gy*G+gx]++;
      }
      var mx=1; for(i=0;i<grid.length;i++) if(grid[i]>mx) mx=grid[i];
      bBucket=new Uint8Array(n); bIdx=[[],[],[],[]];
      for(i=0;i<n;i++){
        var ff=B[i][1], nx=ff[0]/S, ny=ff[1]/S;
        gx=Math.min(G-1,Math.max(0,(nx*G)|0)); gy=Math.min(G-1,Math.max(0,(ny*G)|0));
        var dens=grid[gy*G+gx]/mx;
        var g=Math.min(1, Math.pow(dens,0.55)*(0.45+0.9*hash01(i)));
        for(var c=0;c<CASINO.length;c++){
          var cz=CASINO[c];
          if(nx>=cz[0]&&nx<=cz[0]+cz[2]&&ny>=cz[1]&&ny<=cz[1]+cz[3]){ g=1; break; }
        }
        var bk = g>0.78?3 : g>0.5?2 : g>0.26?1 : 0;
        bBucket[i]=bk; bIdx[bk].push(i);
      }
    }

    /* ===== 畫城市 ===== */
    function poly(f,h,close){
      for(var k=0;k<f.length;k+=2){
        var p=P(f[k]/S,f[k+1]/S,h);
        if(k===0) cx.moveTo(p[0],p[1]); else cx.lineTo(p[0],p[1]);
      }
      if(close) cx.closePath();
    }
    function drawSet(lines,color,wdt){
      cx.strokeStyle=color; cx.lineWidth=wdt; cx.beginPath();
      for(var i=0;i<lines.length;i++) poly(lines[i],0,false);
      cx.stroke();
    }
    function inView(f){
      var p=P(f[0]/S,f[1]/S,0);
      return p[0]>-220&&p[0]<W+220&&p[1]>-280&&p[1]<H+220;
    }
    function buildingPath(f,h,vstep){
      poly(f,h,true);
      for(var k=0;k<f.length;k+=vstep){
        var a=P(f[k]/S,f[k+1]/S,0), b=P(f[k]/S,f[k+1]/S,h);
        cx.moveTo(a[0],a[1]); cx.lineTo(b[0],b[1]);
      }
    }
    function drawCity(){
      if(!MAP) return;
      updTrig();
      cx.clearRect(0,0,W,H);
      cx.fillStyle='#0b0705'; cx.fillRect(0,0,W,H);
      var z=view.s;
      var wf = z>4 ? Math.sqrt(z/4) : 1;          /* 高 zoom 線加粗＝街景感 */
      var nightMul = NIGHT ? 0.78 : 1;             /* 夜晚地面調暗 */

      cx.lineJoin='round';
      drawSet(MAP.coast,'rgba(231,76,60,'+(0.66*nightMul)+')',1);
      if(z>=1.25) drawSet(MAP.roads.c,'rgba(231,76,60,'+(0.18*nightMul)+')',0.5*wf);
      drawSet(MAP.roads.b,'rgba(231,76,60,'+(0.30*nightMul)+')',0.6*wf);
      drawSet(MAP.roads.a,'rgba(231,76,60,'+(0.50*nightMul)+')',0.9*wf);

      /* 建築線框 */
      var B=MAP.buildings3d;
      if(B){
        var lim = z<1.4?60:(z<2.5?26:0);
        var vstep = z>8 ? 2 : 4;                   /* 高 zoom 畫齊每條垂直邊 */
        var bw = 0.6*Math.max(1,Math.sqrt(z/6));
        var drawn=0, i, bi, h, f;
        if(!NIGHT||!bBucket){
          cx.lineWidth=bw; cx.strokeStyle='rgba(231,76,60,.44)'; cx.beginPath();
          for(i=0;i<B.length;i++){
            h=B[i][0]; f=B[i][1];
            if(h<lim||!inView(f)) continue;
            buildingPath(f,h,vstep);
            if(++drawn>9000) break;
          }
          cx.stroke();
        } else {
          /* 夜晚：由亮到暗四層；每層再分三個相位組做超慢閃爍
             （城市燈光緩慢起熄，週期 12–35 秒） */
          var ALPHA=[0.13,0.26,0.46,0.9];
          var tSec=performance.now()/1000;
          for(var bk=3;bk>=0;bk--){
            var idx=bIdx[bk]; if(!idx.length) continue;
            for(var sub=0;sub<3;sub++){
              var ph=Math.sin(tSec*(0.18+0.07*sub+0.05*bk) + bk*2.1 + sub*4.7);
              var m=0.5+0.5*ph;
              var amp = bk>=2 ? (0.6+0.4*m) : (0.8+0.2*m);
              /* 最亮層：屋頂微光填色，跟同一節奏 */
              if(bk===3){
                cx.fillStyle='rgba(231,76,60,'+(0.11*amp).toFixed(3)+')'; cx.beginPath();
                for(i=sub;i<idx.length;i+=3){
                  bi=idx[i]; h=B[bi][0]; f=B[bi][1];
                  if(h<lim||!inView(f)) continue;
                  poly(f,h,true);
                }
                cx.fill();
              }
              cx.lineWidth=bw;
              cx.strokeStyle='rgba(231,76,60,'+(ALPHA[bk]*amp).toFixed(3)+')';
              cx.beginPath();
              for(i=sub;i<idx.length;i+=3){
                bi=idx[i]; h=B[bi][0]; f=B[bi][1];
                if(h<lim||!inView(f)) continue;
                buildingPath(f,h,vstep);
                if(++drawn>9000) break;
              }
              cx.stroke();
              if(drawn>9000) break;
            }
            if(drawn>9000) break;
          }
        }
      }
      drawLabels();
    }
    /* 地名解碼：每 10 秒一輪，由亂碼逐字解返正字 */
    var decodeT0=-1, DECODE_DUR=720, GLY='#%&/<>=+*';
    function decodedName(Z,zi){
      if(decodeT0<0) return Z.n;
      var dp=(performance.now()-decodeT0)/DECODE_DUR;
      if(dp>=1) return Z.n;
      var out='', n=Z.n.length;
      for(var j=0;j<n;j++){
        var c=Z.n[j];
        if(c===' '||c==='.'){ out+=c; continue; }
        var gate=(j+1)/n*0.85 + hash01(zi*31+j)*0.15;
        out += dp>=gate ? c : GLY[(Math.random()*GLY.length)|0];
      }
      return out;
    }
    function drawLabels(){
      cx.textAlign='center'; cx.textBaseline='middle';
      for(var i=0;i<ZONES.length;i++){
        var Z=ZONES[i], p=P(Z.x,Z.y,0);
        if(view.s < (Z.min||1) && activeZone!==Z) continue;
        if(p[0]<-80||p[0]>W+80||p[1]<-40||p[1]>H+40) continue;
        var act = activeZone===Z;
        var fs = Z.sea ? 9 : 9.5;
        var txt = decodedName(Z,i);
        cx.font=(act?'bold ':'')+fs+'px "Share Tech Mono", monospace';
        cx.fillStyle= act ? 'rgba(255,150,120,.95)'
                    : (Z.sea ? 'rgba(231,76,60,.52)' : 'rgba(231,76,60,.75)');
        cx.save();
        if(Z.sea){ cx.globalAlpha=.9; }
        cx.fillText(txt, p[0], p[1]);
        var wdt=cx.measureText(Z.n).width;
        cx.strokeStyle= act?'rgba(255,150,120,.8)':'rgba(231,76,60,.24)';
        cx.lineWidth=1; cx.beginPath();
        cx.moveTo(p[0]-wdt/2,p[1]+7); cx.lineTo(p[0]+wdt/2,p[1]+7); cx.stroke();
        cx.restore();
      }
    }
    function hitZone(mx,my){
      var best=null,bd=30;
      for(var i=0;i<ZONES.length;i++){
        var Z=ZONES[i];
        if(view.s < (Z.min||1)) continue;
        var p=P(Z.x,Z.y,0);
        var d=Math.hypot(p[0]-mx,p[1]-my);
        if(d<bd){ bd=d; best=Z; }
      }
      return best;
    }

    /* ===== 視角動畫（fly-to）===== */
    var anim=null;
    function easeIO(t){ return t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2; }
    /* 令地圖點 (mx,my) 喺指定視角下顯示喺螢幕 (sx,sy) 嘅 view */
    function viewFor(mx,my,s,pitch,yaw,sx,sy){
      var sp=Math.sin(pitch),cp=Math.cos(pitch),sy2=Math.sin(yaw),cy2=Math.cos(yaw);
      var X=(mx-0.5)*ASPECT, Y=(my-0.5);
      var rx=X*cy2-Y*sy2, ry=X*sy2+Y*cy2;
      var k=base*s;
      return { s:s, pitch:pitch, yaw:yaw, x:sx-rx*k, y:sy-ry*cp*k };
    }
    function flyTo(to,ms,done){
      anim={ t0:performance.now(), ms:ms||950, done:done,
        from:{ s:view.s,x:view.x,y:view.y,pitch:view.pitch,yaw:view.yaw }, to:to };
      killInertia();
    }
    function stepAnim(now){
      var t=Math.min(1,(now-anim.t0)/anim.ms), e=easeIO(t);
      var f=anim.from, o=anim.to;
      view.s=Math.exp(Math.log(f.s)+(Math.log(o.s)-Math.log(f.s))*e);
      view.x=f.x+(o.x-f.x)*e;  view.y=f.y+(o.y-f.y)*e;
      view.pitch=f.pitch+(o.pitch-f.pitch)*e;
      view.yaw=f.yaw+(o.yaw-f.yaw)*e;
      targetS=view.s; needDraw=true;
      if(t>=1){ var cb=anim.done; anim=null; if(cb) cb(); }
    }
    function enterZone(Z){
      activeZone=Z; loadZone();
      /* 拉得更近、視角更貼地（pitch 1.38 ≈ 79°） */
      var s=Z.sea?6:12;
      flyTo(viewFor(Z.x,Z.y,s,1.38,view.yaw,W/2,H*0.42),1050,null);
      needDraw=true;
    }
    function resetAerial(){
      if(activeZone){ activeZone=null; loadZone(); }
      flyTo({ s:DEF.s,x:DEF.x,y:DEF.y,pitch:DEF.pitch,yaw:DEF.yaw },1000,null);
      needDraw=true;
    }

    /* ===== 雨：真三維（地圖座標 + 米高度），投影同建築完全一致 =====
       落點就係地面（h=0）；縮放時同城市模型一齊縮放。
       唯一嘅妥協：雨柱高度按畫面 normalize（唔係就會喺
       全景 zoom 下細到一條 30px 帶——13km 空域入面 500m 雨柱係睇唔到嘅），
       但每滴嘅斜度、落點、橫移全部喺世界座標入面行。 */
    var drops=[], rainMM=0, windDeg=0, windSpd=0, lastT=0;
    var vis={x0:0,y0:0,x1:1,y1:1};      /* 目前視窗覆蓋嘅地圖範圍（地面） */
    var hScr=600;                        /* 雨柱世界高度：投影後 = 一個畫面 */
    var wDirX=0, wDirY=0, wTan=0;        /* 風向（地圖座標）+ 斜度 */

    function updRainFrame(){
      var k=base*view.s;
      hScr = H / Math.max(1e-6, k*HSCALE*Math.max(0.2,sinP));
      var p0=invP(0,0), p1=invP(W,0), p2=invP(0,H), p3=invP(W,H);
      var xs=[p0[0],p1[0],p2[0],p3[0]], ys=[p0[1],p1[1],p2[1],p3[1]];
      var x0=Math.min.apply(null,xs), x1=Math.max.apply(null,xs);
      var y0=Math.min.apply(null,ys), y1=Math.max.apply(null,ys);
      var padX=(x1-x0)*0.08, padY=(y1-y0)*0.08;
      /* 逆風擴展 spawn 區，免得雨被吹走後一邊冇雨 */
      var drift=wTan*hScr*HSCALE;
      vis.x0=Math.max(-0.4, x0-padX-(wDirX>0? wDirX*drift:0));
      vis.x1=Math.min(1.4, x1+padX+(wDirX<0? -wDirX*drift:0));
      vis.y0=Math.max(-0.4, y0-padY-(wDirY>0? wDirY*drift:0));
      vis.y1=Math.min(1.4, y1+padY+(wDirY<0? -wDirY*drift:0));
    }
    function newDrop(top){
      return {
        nx: vis.x0+Math.random()*(vis.x1-vis.x0),
        ny: vis.y0+Math.random()*(vis.y1-vis.y0),
        h:  top ? hScr*(0.85+Math.random()*0.35) : Math.random()*hScr*1.15,
        vr: 0.8+Math.random()*0.6,        /* 落速倍率：每滴 0.7–1.25s 落地 */
        lr: Math.random()                  /* 質感層：粗細／亮度 */
      };
    }
    function setRain(mm,deg,spd){
      rainMM=mm||0; windDeg=deg||0; windSpd=spd||0;
      var rad=((windDeg||0)+180)*Math.PI/180;
      wDirX=Math.sin(rad); wDirY=-Math.cos(rad);
      wTan=Math.min(1.1,(windSpd||0)/130);
      updTrig(); updRainFrame();
      var target=Math.min(2400, Math.round(rainMM*190));
      if(rainMM>0 && target<160) target=160;
      while(drops.length<target) drops.push(newDrop(false));
      if(drops.length>target) drops.length=target;
    }
    function drawRain(dt){
      wc.clearRect(0,0,W,H);
      if(!MAP||!drops.length) return;
      updRainFrame();
      var k=base*view.s;
      var pxPerM=k*HSCALE*Math.max(0.2,sinP);   /* 一米高度 = 幾多 px */
      var zBoost=Math.min(1.4, 0.85+0.06*Math.sqrt(view.s));
      wc.lineCap='round';
      for(var i=0;i<drops.length;i++){
        var p=drops[i];
        var v=hScr*p.vr;                        /* m/s：柱高 normalize 落速 */
        p.h-=v*dt;
        p.nx+=wDirX*v*wTan*HSCALE*dt;
        p.ny+=wDirY*v*wTan*HSCALE*dt;
        if(p.h<=0 || p.nx<vis.x0-0.05||p.nx>vis.x1+0.05||p.ny<vis.y0-0.05||p.ny>vis.y1+0.05){
          drops[i]=newDrop(true); continue;
        }
        /* 雨絲：世界空間線段，唔准長過 8m（極限放大都細過一層樓） */
        var Lpx=5+13*p.lr;
        var Lw=Math.min(8, Lpx/pxPerM);
        var b=P(p.nx,p.ny,p.h);
        if(b[0]<-60||b[0]>W+60||b[1]<-60||b[1]>H+60) continue;
        var a=P(p.nx-wDirX*wTan*Lw*HSCALE, p.ny-wDirY*wTan*Lw*HSCALE, p.h+Lw);
        wc.strokeStyle='rgba(231,76,60,'+(0.12+0.48*Math.pow(p.lr,1.3)).toFixed(3)+')';
        wc.lineWidth=(0.4+0.8*p.lr)*zBoost;
        wc.beginPath(); wc.moveTo(a[0],a[1]); wc.lineTo(b[0],b[1]); wc.stroke();
      }
    }

    /* ===== 互動：無限制拖曳 + 慣性 + 平滑縮放 ===== */
    var targetS=1, zAnchor=[0,0];
    var inX=0, inY=0, inOn=false;        /* 慣性速度 px/s */
    function killInertia(){ inOn=false; inX=inY=0; }
    function applyZoom(px,py,ns){
      ns=Math.max(MINZ,Math.min(MAXZ,ns));
      if(ns===view.s) return;
      view.x=px-(px-view.x)*(ns/view.s);
      view.y=py-(py-view.y)*(ns/view.s);
      view.s=ns; needDraw=true;
    }
    cityC.addEventListener('wheel',function(e){
      e.preventDefault();
      if(anim) return;
      targetS=Math.max(MINZ,Math.min(MAXZ, targetS*Math.pow(1.0015,-e.deltaY*1.6)));
      zAnchor=[e.clientX,e.clientY];
    },{passive:false});

    var drag=false,lx=0,ly=0,lt=0,pts={},shift=false,moved=0,vx=0,vy=0;
    cityC.addEventListener('pointerdown',function(e){
      pts[e.pointerId]={x:e.clientX,y:e.clientY};
      if(anim) anim=null;                          /* 一捉就交返控制權 */
      killInertia(); targetS=view.s;
      if(Object.keys(pts).length===1){ drag=true; lx=e.clientX; ly=e.clientY;
        lt=e.timeStamp; vx=vy=0;
        shift=e.shiftKey; moved=0; cityC.classList.add('drag'); }
      cityC.setPointerCapture(e.pointerId);
    });
    cityC.addEventListener('pointermove',function(e){
      if(!pts[e.pointerId]) return;
      var ids=Object.keys(pts);
      if(ids.length>=2){
        var a=pts[ids[0]],b=pts[ids[1]];
        var prev=Math.hypot(a.x-b.x,a.y-b.y);
        pts[e.pointerId]={x:e.clientX,y:e.clientY};
        a=pts[ids[0]]; b=pts[ids[1]];
        var cur=Math.hypot(a.x-b.x,a.y-b.y);
        if(prev>0){ applyZoom((a.x+b.x)/2,(a.y+b.y)/2,view.s*(cur/prev)); targetS=view.s; }
        return;
      }
      pts[e.pointerId]={x:e.clientX,y:e.clientY};
      if(!drag) return;
      var dx=e.clientX-lx, dy=e.clientY-ly;
      var dtm=Math.max(1,e.timeStamp-lt);
      moved+=Math.abs(dx)+Math.abs(dy);
      if(shift){ view.yaw+=dx*0.005;
        view.pitch=Math.max(0.25,Math.min(1.45,view.pitch+dy*0.004)); }
      else {
        view.x+=dx; view.y+=dy;
        /* 速度用低通濾波，慣性先夠順 */
        vx=0.75*(dx/dtm*1000)+0.25*vx;
        vy=0.75*(dy/dtm*1000)+0.25*vy;
      }
      lx=e.clientX; ly=e.clientY; lt=e.timeStamp; needDraw=true;
    });
    function up(e){
      delete pts[e.pointerId];
      if(!Object.keys(pts).length){
        if(drag&&!shift&&Math.hypot(vx,vy)>180&&(e.timeStamp-lt)<90){
          inX=vx; inY=vy; inOn=true;               /* 放手→慣性滑行 */
        }
        drag=false; cityC.classList.remove('drag');
      }
    }
    cityC.addEventListener('pointerup',up);
    cityC.addEventListener('pointercancel',up);
    cityC.addEventListener('click',function(e){
      if(moved>6||anim) return;
      var Z=hitZone(e.clientX,e.clientY);
      if(!Z) return;
      if(Z===activeZone) resetAerial();   /* 再撳已反白地名 → 返回預設視角 */
      else enterZone(Z);
    });

    /* ===== 主循環：動畫／慣性／平滑縮放／雨 ===== */
    var nAcc=0;
    function frame(now){
      requestAnimationFrame(frame);
      if(document.hidden){ lastT=now; return; }
      var dt=lastT? Math.min(0.05,(now-lastT)/1000):0.016; lastT=now;

      /* 地名解碼進行中 → 連續重畫；夜晚燈光閃爍 → 節流 ~7fps 重畫 */
      if(decodeT0>0 && now-decodeT0 < DECODE_DUR+120) needDraw=true;
      if(NIGHT&&MAP){ nAcc+=dt; if(nAcc>0.14){ needDraw=true; nAcc=0; } }

      if(anim) stepAnim(now);
      else {
        if(Math.abs(Math.log(targetS/view.s))>0.0015){
          var ns=view.s*Math.pow(targetS/view.s, 1-Math.exp(-dt*11));
          applyZoom(zAnchor[0],zAnchor[1],ns);
        }
        if(inOn){
          view.x+=inX*dt; view.y+=inY*dt;
          var f=Math.exp(-dt*3.4); inX*=f; inY*=f;
          if(Math.hypot(inX,inY)<12) killInertia();
          needDraw=true;
        }
      }
      if(needDraw){ updTrig(); drawCity(); needDraw=false; }
      else updTrig();
      drawRain(dt);
    }

    /* ===== 讀數 ===== */
    var DIRS=['N','NE','E','SE','S','SW','W','NW'];
    function dirOf(d){ return DIRS[Math.round(((d||0)%360)/45)%8]; }
    function label(mm){
      if(mm<=0) return 'dry';
      if(mm<0.6) return 'trace';
      if(mm<2.5) return 'light rain';
      if(mm<7.6) return 'moderate rain';
      if(mm<20) return 'heavy rain';
      if(mm<50) return 'very heavy rain';
      return 'torrential';
    }
    var M2=12.4206*3600*1000;
    function tideAt(ms){
      var ph=(ms%M2)/M2*Math.PI*2;
      return 1.35+1.05*Math.sin(ph)+0.18*Math.sin(ph*2+1.1);
    }
    function macauHour(ms){
      try{
        return +new Intl.DateTimeFormat('en-GB',{hour:'2-digit',hour12:false,timeZone:'Asia/Macau'})
          .format(new Date(ms));
      }catch(e){ return new Date(ms).getHours(); }
    }
    function paint(mm,deg,spd,gust,press,when,foot){
      setRain(mm,deg,spd);
      NIGHT = (function(h){ return h>=19||h<6; })(macauHour(when||Date.now()));
      document.getElementById('rMm').innerHTML=
        (Math.round(mm*10)/10)+'<span style="font-size:.4em"> MM/H</span>';
      var st=document.getElementById('rState');
      st.textContent=label(mm);
      if(window.HikkiCrack) window.HikkiCrack.startOn(window.HikkiCrack.collect(st),{budgetMs:400});
      document.getElementById('rWind').textContent = spd==null?'--':Math.round(spd)+' km/h';
      document.getElementById('rDir').textContent  = deg==null?'--':dirOf(deg)+' '+Math.round(deg)+'°';
      document.getElementById('rGust').textContent = gust==null?'--':Math.round(gust)+' km/h';
      document.getElementById('rPress').textContent= press==null?'--':Math.round(press)+' hPa';
      document.getElementById('rTide').textContent = tideAt(when||Date.now()).toFixed(2)+' m';
      document.getElementById('rZone').textContent = activeZone? activeZone.n : 'MACAU';
      document.getElementById('hFoot').innerHTML = foot;
      readyWx=true; bootCheck();
      needDraw=true; alignHead();
    }

    var MODE={ kind:'live', date:null, name:'' };
    function coordOf(){ return activeZone? [activeZone.lat,activeZone.lon] : [22.193,113.549]; }
    var LIVE_FOOT='LIVE';

    function loadLive(){
      var c=coordOf();
      MODE={kind:'live'};
      fetch('https://api.open-meteo.com/v1/forecast?latitude='+c[0]+'&longitude='+c[1]+
            '&current=precipitation,wind_speed_10m,wind_direction_10m,wind_gusts_10m,pressure_msl'+
            '&timezone=Asia%2FMacau')
        .then(function(r){return r.json();})
        .then(function(d){
          if(!d||!d.current) throw 0;
          var u=d.current;
          paint(u.precipitation||0,u.wind_direction_10m,u.wind_speed_10m,
                u.wind_gusts_10m,u.pressure_msl,Date.now(),LIVE_FOOT);
          clockOn=true;
        })
        .catch(function(){ paint(0,null,null,null,null,Date.now(),'NO SIGNAL'); });
    }
    function loadStorm(date,name){
      var c=coordOf();
      MODE={kind:'storm',date:date,name:name};
      document.getElementById('hFoot').textContent='RETRIEVING…';
      fetch('https://archive-api.open-meteo.com/v1/archive?latitude='+c[0]+'&longitude='+c[1]+
            '&start_date='+date+'&end_date='+date+
            '&hourly=precipitation,wind_speed_10m,wind_direction_10m,wind_gusts_10m,pressure_msl'+
            '&timezone=Asia%2FMacau')
        .then(function(r){return r.json();})
        .then(function(d){
          if(!d||!d.hourly) throw 0;
          var pr=d.hourly.precipitation||[], pk=0;
          pr.forEach(function(v,i){ if((v||0)>(pr[pk]||0)) pk=i; });
          paint(pr[pk]||0,d.hourly.wind_direction_10m[pk],d.hourly.wind_speed_10m[pk],
                d.hourly.wind_gusts_10m[pk],d.hourly.pressure_msl[pk],
                new Date(d.hourly.time[pk]).getTime(),
                name+' · PEAK '+d.hourly.time[pk].slice(11));
          document.getElementById('hClock').textContent=d.hourly.time[pk].slice(11)+':00';
          clockOn=false; alignHead();
        })
        .catch(function(){ document.getElementById('hFoot').textContent='ARCHIVE UNAVAILABLE'; });
    }
    /* 撳堂區／海域：跟返目前模式（live 或 archive）攞嗰區數據 */
    function loadZone(){
      if(MODE.kind==='storm') loadStorm(MODE.date,MODE.name);
      else loadLive();
    }

    /* ===== STATION / ARCHIVE：拉伸收合選單（互斥） =====
       開：由按鈕嗰邊一層層機械式浮現，每項出現時做一次解碼動畫
       關：反向收返入按鈕 */
    var MENUS=[];
    function wireMenu(btnId,listId,labelTxt){
      var btn=document.getElementById(btnId), list=document.getElementById(listId);
      var items=[].slice.call(list.querySelectorAll('button'));
      var mq=window.matchMedia('(max-width:767px)');
      var M={ open:false, timers:[] };
      function clearTimers(){ M.timers.forEach(clearTimeout); M.timers=[]; }
      /* 兩個選單項數唔同（9 / 10），所以用「固定總時長 ÷ 項數」而唔係固定間距，
         咁樣兩個選單嘅展開／收合節奏先至完全一致 */
      var OPEN_MS=400, CLOSE_MS=250;
      var stepIn = OPEN_MS/Math.max(1,items.length);
      var stepOut = CLOSE_MS/Math.max(1,items.length);
      M.close=function(fast){
        if(!M.open) return;
        M.open=false; clearTimers();
        btn.classList.remove('on'); btn.textContent=labelTxt+' ▾';
        /* 收合：離按鈕最遠嗰項先縮 */
        var ordered = mq.matches ? items.slice().reverse() : items;
        ordered.forEach(function(it,k){
          M.timers.push(setTimeout(function(){ it.classList.remove('in'); }, fast?0:k*stepOut));
        });
        M.timers.push(setTimeout(function(){ list.classList.remove('open'); },
          fast?170:CLOSE_MS+180));
      };
      M.openUp=function(){
        MENUS.forEach(function(o){ if(o!==M) o.close(true); });   /* 互斥 */
        M.open=true; clearTimers();
        btn.classList.add('on'); btn.textContent=labelTxt+' ▴';
        list.classList.add('open');
        /* 展開：最貼近按鈕嗰項先現（桌面 list 喺上 → 由尾開始） */
        var ordered = mq.matches ? items : items.slice().reverse();
        ordered.forEach(function(it,k){
          M.timers.push(setTimeout(function(){
            it.classList.add('in');
            if(window.HikkiCrack)
              window.HikkiCrack.startOn(window.HikkiCrack.collect(it),{budgetMs:260});
          }, 40+k*stepIn));
        });
      };
      btn.addEventListener('click',function(){ M.open? M.close(false) : M.openUp(); });
      MENUS.push(M);
      return M;
    }
    wireMenu('btnArchive','archList','ARCHIVE');
    wireMenu('btnStation','staList','STATION');

    var archList=document.getElementById('archList');
    [].forEach.call(archList.querySelectorAll('button'),function(b){
      b.dataset.label=b.textContent;               /* 解碼中撳都攞到正名 */
      b.addEventListener('click',function(){
        [].forEach.call(archList.querySelectorAll('button'),function(x){x.classList.remove('on');});
        b.classList.add('on');
        if(b.dataset.d==='live') loadLive();
        else loadStorm(b.dataset.d,b.dataset.label.trim());
      });
    });
    var staList=document.getElementById('staList');
    [].forEach.call(staList.querySelectorAll('button'),function(b){
      b.addEventListener('click',function(){
        [].forEach.call(staList.querySelectorAll('button'),function(x){x.classList.remove('on');});
        b.classList.add('on');
        if(b.dataset.z==='aerial'){ resetAerial(); return; }
        for(var i=0;i<ZONES.length;i++)
          if(ZONES[i].n===b.dataset.z){ enterZone(ZONES[i]); break; }
      });
    });

    /* ===== 時鐘 + 座標（闊度強制對齊時鐘） ===== */
    var clockOn=true;
    function textW(el){
      var r=document.createRange(); r.selectNodeContents(el);
      return r.getBoundingClientRect().width;
    }
    function alignHead(){
      var ck=document.getElementById('hClock'), co=document.getElementById('hCoord');
      var w1=textW(ck); if(!w1) return;
      co.style.letterSpacing='0px';
      var n=co.textContent.length; if(!n) return;
      var w2=textW(co); if(!w2) return;
      var sp=(w1-w2)/n;
      co.style.letterSpacing=sp+'px';
      var w3=textW(co);                       /* trailing spacing 修正 */
      if(Math.abs(w3-w1)>0.5) co.style.letterSpacing=(sp+(w1-w3)/n)+'px';
    }
    setInterval(function(){
      if(document.hidden) return;
      if(clockOn) document.getElementById('hClock').textContent=
        new Date().toLocaleTimeString('en-GB',{timeZone:'Asia/Macau',hour12:false});
      var c=coordOf();
      document.getElementById('hCoord').textContent=
        (c[0]+(Math.random()-0.5)*0.004).toFixed(4)+' | '+(c[1]+(Math.random()-0.5)*0.004).toFixed(4);
      alignHead();
    },1000);

    /* 地名每 10 秒解碼一次 */
    setInterval(function(){ if(!document.hidden) decodeT0=performance.now(); },10000);

    /* ===== 開機：地圖 + 首次天氣讀數 + 最少 1.6s ===== */
    var bootEl=document.getElementById('boot');
    var bootT0=performance.now(), readyMap=false, readyWx=false, bootOff=false;
    function bootCheck(){
      if(bootOff) return;
      if(readyMap&&!readyWx) document.getElementById('bootT').textContent='CALIBRATING RAINFALL';
      if(readyMap&&readyWx&&performance.now()-bootT0>1600){
        bootOff=true; bootEl.classList.add('off'); alignHead();
      } else setTimeout(bootCheck,240);
    }
    /* 開機座標漂移：一位一位咁跳（似搜索緊，同 404 同款） */
    (function bootDrift(){
      if(bootOff) return;
      var el=document.getElementById('bootC');
      if(el && !document.hidden){
        var s=el.textContent.split(''), idxs=[];
        for(var i=0;i<s.length;i++) if(s[i]>='0'&&s[i]<='9') idxs.push(i);
        var take=1+((Math.random()*2)|0);
        for(var k=0;k<take&&idxs.length;k++){
          var p=idxs.splice((Math.random()*idxs.length)|0,1)[0];
          s[p]=String((Math.random()*10)|0);
        }
        el.textContent=s.join('');
      }
      setTimeout(bootDrift, 60+Math.random()*120);
    })();
    fit(); resetView();
    fetch('macau-map.json?v=17').then(function(r){return r.json();})
      .then(function(j){ MAP=j; resetView(); prepGlow(); needDraw=true;
        readyMap=true; bootCheck(); })
      .catch(function(){ document.getElementById('bootT').textContent='SURVEY UNAVAILABLE'; });
    loadLive();
    requestAnimationFrame(frame);
    var rz; window.addEventListener('resize',function(){
      clearTimeout(rz); rz=setTimeout(function(){ fit(); resetView(); needDraw=true; alignHead(); },150); });
  })();
  </script>
</body>
</html>
