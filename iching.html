  <style>
    :root {
      --font-sans: Helvetica, Arial, system-ui, -apple-system, sans-serif;
      --font-mono: "Courier New", Courier, ui-monospace, SFMono-Regular, Menlo, monospace;
      --font-ja: "Noto Serif JP", serif;
      --ivory: #f4f2f0; --ink: #000;
      --judge-accent: #e74c3c;
      /* 黑底頁：header 提高不透明度，免磨砂混黑變灰 */
      --hk-bar-alpha: 0.92;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      min-height: 100%;
      background: #000; color: var(--ivory);
      overflow-x: hidden; overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
      touch-action: manipulation;
      -webkit-text-size-adjust: 100%;
    }

    .blink-block { display: inline-block; animation: blink3 3s infinite; }
    @keyframes blink3 { 0%, 50%, 100% { opacity: 1; } 25%, 75% { opacity: 0; } }

    /* ===== 背景：卦象 × Frege 概念文字推理圖（純裝飾，不可選不可點） ===== */
    .bg-data {
      position: fixed; inset: 0; z-index: 0;
      pointer-events: none; user-select: none; -webkit-user-select: none;
      overflow: hidden;
    }
    .bg-data svg { display: block; width: 100%; height: 100%; }

    /* ===================================================================
       儀器版面（同 rainfall / console 同一套語言）
       手機：上＝九管 nixie，中＝兩個掣，下＝三個屏
       電腦：左 2/5 nixie，中＝掣，右＝屏
       =================================================================== */
    :root{
      --ink:#0b0705; --amb:#e74c3c;
      --f-num:'Share Tech Mono','Courier New',monospace;
    }
    html,body{ background:var(--ink); color:var(--amb); overflow:hidden; }
    body{ font-family:var(--f-num); }

    .grain{ position:fixed; inset:0; z-index:3; pointer-events:none;
      background:repeating-linear-gradient(0deg, rgba(0,0,0,.13) 0 1px, transparent 1px 3px);
      mix-blend-mode:multiply; }
    .vig{ position:fixed; inset:0; z-index:3; pointer-events:none;
      background:radial-gradient(120% 90% at 50% 42%, transparent 50%, rgba(11,7,5,.55) 100%); }

    /* header / menu：同 rainfall 一套暗油墨 + 橙字 */
    .hk-bar{ background:rgba(11,7,5,.34) !important;
      -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); color:var(--amb) !important; }
    .hk-bar .hk-rotator,.hk-bar .hk-menu-btn,.hk-bar .hk-logo{ color:var(--amb) !important; }
    .hk-bar .hk-logo .hk-sq{ background:var(--amb) !important; }
    .hk-menu{ background:rgba(11,7,5,.93) !important; color:var(--amb) !important; }
    .hk-menu-list li{ border-bottom-color:rgba(231,76,60,.26) !important; }
    .hk-menu-list a,.hk-menu-list button{ color:var(--amb) !important; }
    .hk-menu-contact li,.hk-menu-contact a{ color:rgba(231,76,60,.78) !important; }
    .hk-menu-contact .hk-contact-head{ color:var(--amb) !important; }
    .hk-menu-geo{ color:rgba(231,76,60,.6) !important; }
    .hk-menu-copy{ color:rgba(231,76,60,.66) !important; border-top-color:rgba(231,76,60,.26) !important; }
    /* >direct message：紅主題頁面用亮橙 highlight */
    .hk-menu-contact a.hk-enq{ color:#ff9d4a !important;
      border-bottom-color:rgba(255,157,74,.45) !important; }
    .hk-menu-contact a.hk-enq:hover{ color:#ffc48a !important;
      border-bottom-color:#ffc48a !important; }
    /* 背景推理樹壓到極淡，唔好搶儀器 */
    .bg-data{ opacity:.13; }

    .rig-wrap{ position:fixed; inset:0; z-index:2; display:flex;
      align-items:center; justify-content:center;
      padding:calc(var(--hk-bar-h) + 6px) clamp(10px,3vw,28px) 14px;
      overflow:hidden; }
    .rig{ width:100%; max-width:min(440px, 90vw);
      height:100%; display:flex; flex-direction:column; min-height:0; }

    .panel{ position:relative; border:1.2px solid rgba(231,76,60,.7); border-radius:8px;
      box-shadow:inset 0 0 0 3px rgba(11,7,5,1), inset 0 0 0 4px rgba(231,76,60,.28);
      padding:clamp(11px,2vh,20px) clamp(11px,2.6vw,20px);
      display:flex; flex-direction:column; gap:clamp(8px,1.5vh,16px);
      flex:1 1 auto; min-height:0; overflow:hidden; }
    .screw{ position:absolute; width:9px; height:9px; border:1px solid rgba(231,76,60,.5);
      border-radius:50%; }
    .screw::after{ content:''; position:absolute; inset:1.4px;
      border-top:1px solid rgba(231,76,60,.6); transform:rotate(38deg); }
    .screw.tl{ top:7px; left:7px; } .screw.tr{ top:7px; right:7px; }
    .screw.bl{ bottom:7px; left:7px; } .screw.br{ bottom:7px; right:7px; }

    /* ── ① NIXIE 九管：SVG 玻璃管 + 真六角蜂巢網 + 描邊數字 ── */
    .nx-defs{ position:absolute; width:0; height:0; overflow:hidden; }
    .scr-lab{ font-size:7.5px; letter-spacing:.24em;
      color:rgba(231,76,60,.55); margin-bottom:6px; }
    .pad{ display:grid; grid-template-columns:repeat(3,1fr);
      gap:clamp(7px,2vw,13px); width:min(100%, 74%); margin:0 auto; }
    .digit{ appearance:none; border:0; background:none; cursor:pointer; padding:0;
      touch-action:manipulation; display:block; position:relative; }
    /* 鍵盤游標：一條幼橫線指住而家收緊字嗰支管 */
    .digit::after{ content:''; position:absolute; left:28%; right:28%; bottom:-6px;
      height:1.5px; background:#ff9d4a; opacity:0;
      transition:opacity .18s, left .18s, right .18s; }
    .digit.cursor::after{ opacity:.62; }
    .digit.cursor.hit::after{ opacity:1; left:20%; right:20%; }
    .nx{ width:100%; height:auto; display:block; overflow:visible; }

    /* 玻璃殼 */
    .nx-glass{ fill:none; stroke:rgba(231,76,60,.72); stroke-width:1.5; }
    /* 內側一條更暗嘅輪廓＝玻璃厚度（唯一嘅「陰影」，純線） */
    .nx-inner{ fill:none; stroke:rgba(120,34,22,.9); stroke-width:1; }
    /* 底部一小段暗線＝管座陰影 */
    .nx-shade{ fill:none; stroke:rgba(120,34,22,.85); stroke-width:2.4;
      stroke-linecap:round; }
    /* 蜂巢網罩（陽極） */
    .nx-net{ fill:none; stroke:rgba(231,76,60,.34); stroke-width:.55; }
    /* 未亮陰極：描邊、暗銅 */
    .nx-gh{ fill:none; stroke:rgba(190,72,44,.28); stroke-width:1.6;
      font-family:var(--f-num); font-size:86px; text-anchor:middle;
      paint-order:stroke; }
    .nx-gh.b{ stroke:rgba(190,72,44,.2); }
    .nx-gh.c{ stroke:rgba(190,72,44,.15); }
    /* 亮住嗰個：幼描邊 + 三層輝光，填滿玻璃 */
    .digit-num{ fill:none; stroke:#ff5f2e; stroke-width:2.6;
      stroke-linecap:round; stroke-linejoin:round;
      font-family:var(--f-num); font-size:92px; text-anchor:middle;
      filter:url(#nxGlow); transition:stroke .16s, stroke-width .16s; }
    .digit.tapped .digit-num{ stroke:#ff9a5c; stroke-width:3.1; }
    .digit.invalid-leading .digit-num{ stroke:#ff5a4a; }
    .digit:hover .nx-glass{ stroke:rgba(231,76,60,.72); }
    /* 金屬底座 */
    .nx-base{ fill:none; stroke:rgba(231,76,60,.85); stroke-width:1.3; }
    @keyframes padFlash{ 0%,100%{opacity:1} 50%{opacity:.35} }
    .pad.flash .digit{ animation:padFlash .18s linear 3; }

    /* ── ② 兩個掣：參考 console 降水燈嘅光影 ── */
    .btn-bay{ display:grid; grid-template-columns:1fr 1fr; gap:clamp(10px,2vw,16px); }
    /* 掣：單色平面，只用線同字嘅明度分級。冇漸變、冇泛光。 */
    .ibtn{ appearance:none; cursor:pointer; text-align:center; user-select:none;
      font-family:var(--f-num); font-size:11px; letter-spacing:.22em;
      padding:8px 6px; border-radius:4px; background:none;
      border:1px solid rgba(231,76,60,.34); color:rgba(231,76,60,.4);
      transition:color .2s, border-color .2s; touch-action:manipulation; }
    .ibtn.cast{ color:rgba(231,76,60,.85); border-color:rgba(231,76,60,.75); }
    .ibtn.cast:hover{ color:#ff9d88; border-color:#ff9d88; }
    .ibtn[disabled]{ cursor:default; color:rgba(231,76,60,.18);
      border-color:rgba(231,76,60,.15); }
    .ibtn.armed{ color:rgba(231,76,60,.85); border-color:rgba(231,76,60,.75); }
    .ibtn.done{ color:#ff9d88; border-color:#ff9d88; }

    /* ── ③ 三個顯示屏：金屬圓角 + console 玻璃光影 ── */
    .nixie-bay{ flex:0 0 auto; }
    .btn-bay{ flex:0 0 auto; }
    /* 屏區吃走剩餘高度；長屏內部自己滾 */
    .scr-bay{ display:grid; grid-template-columns:1fr 1fr;
      grid-template-rows:auto minmax(0,1fr);
      gap:clamp(8px,1.8vw,13px); flex:1 1 auto; min-height:0; }
    .scr-wide{ display:flex; flex-direction:column; min-height:0; }
    .scr-wide > .intro, .scr-wide > .result{
      min-height:0; overflow-y:auto; overscroll-behavior:contain;
      scrollbar-width:thin; }
    .scr-wide > .intro::-webkit-scrollbar,
    .scr-wide > .result::-webkit-scrollbar{ width:3px; }
    .scr-wide > .intro::-webkit-scrollbar-thumb,
    .scr-wide > .result::-webkit-scrollbar-thumb{ background:rgba(231,76,60,.34); }
    .scr{ position:relative; overflow:hidden; border-radius:6px;
      border:1px solid rgba(231,76,60,.42);
      padding:7px 9px 9px; min-height:0;
      background:none; }
    .scr-wide{ grid-column:1 / -1; min-height:0; }
    /* 卦名唔再喺卦象屏下面佔一行（會撐大屏、逼細斷方塊）。
       保留元素畀原本邏輯／複製用，只係唔顯示。 */
    .scr-name{ display:none; }
    /* 卦名改喺斷方塊頂，一行過，撳得出卦辭 */
    /* 斷方塊首行：本卦／之卦 + 卦氣星宿，一次過交代晒 */
    .jgua{ margin-bottom:6px; padding-bottom:6px;
      border-bottom:1px solid rgba(231,76,60,.22); }
    .jg-row{ display:flex; align-items:baseline; gap:8px; margin-top:2px; }
    .jg-row:first-child{ margin-top:0; }
    .jg-row b{ flex:0 0 auto; font-weight:400; font-family:var(--f-num);
      font-size:8px; letter-spacing:.2em; color:rgba(231,76,60,.45); }
    .jgua .g{ font-family:var(--hk-font-ja),serif; font-size:14.5px;
      color:var(--amb); letter-spacing:.04em; cursor:pointer;
      touch-action:manipulation; }
    .jgua .g:hover{ color:#ff9d88; }
    .jg-row i{ margin-left:auto; font-style:normal; font-family:var(--f-num);
      font-size:9px; letter-spacing:.1em; color:rgba(231,76,60,.5);
      white-space:nowrap; }
    .scr-meta{ display:none; }   /* 節氣／星宿搬咗去斷方塊首行 */

    /* 卦象：保留原本逐爻浮現動畫 */
    .hexlines{ display:flex; flex-direction:column-reverse; gap:5px; margin-top:4px;
      position:relative; z-index:1; }
    .hline{ height:8px; display:flex; gap:0; cursor:pointer; position:relative;
      touch-action:manipulation;
      opacity:0; transform:translateY(6px);
      transition:opacity .3s ease, transform .3s ease; }
    .hline .seg{ flex:1; height:100%; background:rgba(231,76,60,.9);
      box-shadow:0 0 5px rgba(231,76,60,.5); transition:background .2s, box-shadow .2s; }
    .hline.yin{ gap:26%; }
    .hline.show{ opacity:1; transform:none; }
    .hline:hover .seg{ background:#ff9d88; }
    .hline.moving .seg{ background:#ff9d4a;
      box-shadow:0 0 7px rgba(255,157,74,.9), 0 0 18px rgba(255,157,74,.4); }
    /* 爻只得 8px 高，手指撳唔中。用透明 slug 撐大命中範圍（全裝置）。 */
    .hline::before{ content:''; position:absolute;
      left:-10px; right:-18px; top:-3px; bottom:-3px; }
    .hline.moving::after{ content:'●'; position:absolute; right:-13px; top:50%;
      transform:translateY(-50%); font-size:6px; color:#ff9d4a; }

    /* 長屏內容 */
    /* hover 爻詞浮層：position:fixed，唔參與機器版面 */
    .yao-tip{ position:fixed; z-index:60; pointer-events:none; opacity:0;
      max-width:min(300px,72vw); padding:6px 9px;
      border:1px solid rgba(231,76,60,.6); background:rgba(11,7,5,.96);
      font-family:var(--hk-font-ja),serif; font-size:11px; line-height:1.6;
      color:var(--amb); transition:opacity .14s ease; }
    .yao-tip.on{ opacity:1; }
    .yao-tip b{ display:block; font-family:var(--f-num); font-weight:400;
      font-size:7.5px; letter-spacing:.2em; color:rgba(231,76,60,.55); margin-bottom:2px; }

    /* ══ 手機：四個板塊高度鎖死，唔准伸縮 ══
       nixie 27% ｜ 掣 30px ｜ 卦象屏 17% ｜ 斷＝剩餘（實測 ≈ 全頁 44%）
       百分比對住 .panel，所以任何屏高比例都一樣。 */
    @media (max-width:767px){
      .panel{ display:grid;
        grid-template-rows:30% 30px minmax(0,1fr);
        gap:8px; align-content:stretch; }
      /* 屏區內部再鎖一次：卦象 27%（但唔可以細過內容），斷食曬剩低 */
      .scr-bay{ grid-template-rows:minmax(92px,23%) minmax(0,1fr); }
      .nixie-bay, .btn-bay, .scr-bay, .scr-wide{ min-height:0; }
      /* pad 由高度反推闊度，唔再由闊度推高度 */
      .pad{ height:100%; width:auto; aspect-ratio:29/30;
        grid-template-rows:repeat(3,minmax(0,1fr));
        gap:clamp(5px,1.6vw,9px); margin:0 auto; }
      .digit{ min-width:0; min-height:0; }
      .nx{ width:100%; height:100%; }
      .btn-bay{ align-items:stretch; }
      .ibtn{ padding:0; display:flex; align-items:center; justify-content:center; }
      .scr-bay{ display:grid; grid-template-columns:1fr 1fr;
        gap:clamp(8px,1.8vw,13px); }
      .scr-wide{ grid-column:1 / -1; }
      .scr-wide{ display:flex; flex-direction:column; }
      .hexlines{ gap:4px; }
    }

    /* 矮機（SE 之類）：爻線再收窄，等卦象屏 106px 都放得落 */
    @media (max-width:767px) and (max-height:720px){
      .hline{ height:7px; }
      .hexlines{ gap:3px; }
      .scr-lab{ margin-bottom:4px; }
      .scr-meta{ font-size:7.5px; }
    }

    /* ── 爻詞彈出：手機單點即開（本來冇樣式，等於撳極都唔見嘢） ── */
    .yao-pop{ position:fixed; z-index:70; left:0; right:0; bottom:0;
      background:rgba(11,7,5,.97);
      border-top:1.2px solid rgba(231,76,60,.7);
      padding:15px 16px calc(17px + env(safe-area-inset-bottom, 0px));
      transform:translateY(101%); visibility:hidden;
      transition:transform .26s cubic-bezier(.3,.9,.35,1), visibility 0s .26s; }
    .yao-pop.open{ transform:none; visibility:visible; transition-delay:0s; }
    /* 幕布：獨立元素。放喺 .yao-pop 入面會被 host 嘅 transform 困住。 */
    .pop-veil{ position:fixed; inset:0; z-index:69; background:rgba(6,4,3,.58);
      opacity:0; visibility:hidden; transition:opacity .26s, visibility 0s .26s; }
    .pop-veil.on{ opacity:1; visibility:visible; transition-delay:0s; }
    .pop-close{ position:absolute; top:7px; right:10px; appearance:none; border:0;
      background:none; cursor:pointer; font-family:var(--f-num); font-size:19px;
      line-height:1; color:rgba(231,76,60,.6); padding:5px 8px; touch-action:manipulation; }
    .pop-close:hover{ color:#ff9d88; }
    .pop-lab{ display:block; font-family:var(--f-num); font-size:7.5px;
      letter-spacing:.24em; color:rgba(231,76,60,.55); margin-bottom:6px; }
    .pop-body{ font-family:var(--hk-font-ja),serif; font-weight:200;
      font-size:14.5px; line-height:1.9; color:var(--amb);
      max-height:36vh; overflow-y:auto; overscroll-behavior:contain; }

    .scr-msg{ flex:0 0 auto; font-family:var(--hk-font-ja),serif;
      font-size:10.5px; line-height:1.6; color:#ff9d88;
      border-left:2px solid #ff9d88; padding:2px 0 2px 7px; margin-bottom:5px; }
    .intro p{ font-family:var(--hk-font-ja),serif; font-weight:200;
      font-size:12.5px; line-height:1.8; color:rgba(231,76,60,.78); }
    .ic-hist{ margin-top:7px; font-size:10.5px; line-height:1.75;
      color:rgba(231,76,60,.5); }
    .ic-hist b{ font-weight:400; color:rgba(231,76,60,.78); }
    .ic-hist .ic-copy{ appearance:none; border:0; background:none; cursor:pointer;
      font-family:var(--f-num); font-size:8.5px; color:rgba(231,76,60,.42);
      margin-left:9px; padding:1px 0; border-bottom:1px solid transparent; }
    .ic-hist .ic-copy:hover{ color:var(--amb); border-bottom-color:var(--amb); }
    .judge{ font-size:12px; line-height:1.8; }
    .jlab{ display:block; font-size:7.5px; letter-spacing:.24em;
      color:rgba(231,76,60,.5); margin-bottom:4px; }
    .jsum{ display:block; font-family:var(--hk-font-ja),serif;
      color:#ff9d88; font-size:13px; margin-bottom:4px; }
    .jlines{ font-family:var(--hk-font-ja),serif; color:var(--amb); }
    .starline{ margin-top:7px; padding-top:6px;
      border-top:1px solid rgba(231,76,60,.22);
      font-size:9.5px; letter-spacing:.06em; color:rgba(231,76,60,.62); }
    .starline .sname{ color:var(--amb); margin-right:6px; }
    .fx{ opacity:0; transform:translateY(5px);
      transition:opacity .4s ease, transform .4s ease; }
    .result.on .fx{ opacity:1; transform:none; }

    .site-copy{ flex:0 0 auto; margin-top:8px; font-family:var(--f-num); font-size:9px;
      letter-spacing:.1em; color:rgba(231,76,60,.4); }

    @media (min-width:768px){
      .yao-pop{ inset:0; margin:auto; width:min(470px,86vw); height:max-content;
        border:1.2px solid rgba(231,76,60,.7); border-radius:8px; border-top-width:1.2px;
        padding:16px 18px 18px;
        transform:none; opacity:0;
        transition:opacity .2s ease, visibility 0s .2s; }
      .yao-pop.open{ opacity:1; }
      .pop-body{ max-height:52vh; }
    }

    /* ── 列印：唔印機台，印文字紀錄 ── */
    @media print{
      .rig-wrap{ display:none !important; }
      .ic-doc{ font-family:var(--f-num), ui-monospace, monospace; color:#000; }
      .ic-doc .r{ display:grid; grid-template-columns:96px 1fr; gap:1px 12px;
        font-size:10.5px; letter-spacing:.08em; margin-bottom:3px; }
      .ic-doc .r b{ font-weight:400; color:#555; }
      .ic-doc .cjk{ font-family:var(--hk-font-ja),serif; font-size:12.5px; letter-spacing:0; }
      .ic-doc .hx{ margin:9px 0 12px; }
      .ic-doc .hx .l{ font-family:var(--f-num); font-size:11px; letter-spacing:.3em;
        line-height:1.55; }
      .ic-doc .jd{ margin-top:10px; padding-top:8px; border-top:1px solid #000;
        font-family:var(--hk-font-ja),serif; font-size:12px; line-height:1.85; }
      .ic-doc .none{ font-size:10.5px; letter-spacing:.14em; color:#555; }
    }

    /* ── 電腦：左 2/5 nixie，中掣，右屏 ── */
    @media (min-width:768px){
      /* 機台高度由九管自己嘅比例決定，唔再被視窗拉長 → 橫置機架比例 */
      .rig{ max-width:1000px; height:auto; max-height:100%;
        justify-content:center; }
      .panel{ display:grid; gap:clamp(16px,2.2vw,30px);
        grid-template-columns:minmax(0,1.85fr) 126px minmax(0,2.35fr);
        grid-template-rows:auto minmax(0,1fr);
        align-items:stretch; flex:0 1 auto; }
      /* pad 唔可以食高度，否則三行會被扯開 */
      .nixie-bay{ grid-column:1; grid-row:1 / 3; align-self:center; }
      .nixie-bay .pad{ height:auto; width:100%; aspect-ratio:auto; }
      .btn-bay{ grid-column:2; grid-row:1 / 3; grid-template-columns:1fr;
        align-self:center; width:100%; min-width:0; gap:12px; }
      /* height:0 → 屏區唔參與機台高度（高度只由九管決定）；
         min-height:100% → 再撐返滿嗰一行。長判詞只會喺框內自己滾。 */
      .scr-bay{ grid-column:3; grid-row:1 / 3; align-self:stretch;
        grid-template-rows:auto minmax(0,1fr);
        height:0; min-height:100%; }
      .scr-wide{ grid-column:1 / -1; display:flex; flex-direction:column;
        height:auto; min-height:0; }
      .scr{ min-height:0; }
      .scr-wide .result{ flex:1; }
      .site-copy{ grid-column:1 / -1; }
      .pad{ width:100%; }
      /* 極矮視窗：寧願縮細九管，都唔可以爆出機台 */
      @media (max-height:560px){
        .pad{ width:min(100%, calc((100vh - 190px) * .96)); margin:0 auto; }
      }
    }
  </style>

  <script>
    /* 背景生成器已抽出至 bg-frege.js（同 game 共用） */

    /* ===== 文字解碼（本頁專用，即載即用） ===== */
    var Crack = (function(){
      var CJK = "天地玄黃宇宙洪荒日月盈昃辰宿列張寒來暑往秋收冬藏閏餘成歲律召調陽雲騰致雨露結爲霜金生麗水玉出崑岡劍號巨闕珠稱夜光";
      var LAT = "0123456789";
      function collect(root){
        var out = [], w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
          acceptNode: function(n){ return n.nodeValue && n.nodeValue.trim() ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT; }
        });
        while (w.nextNode()) out.push(w.currentNode);
        return out;
      }
      function crack(root, budgetMs){
        var nodes = collect(root);
        if (!nodes.length) return;
        var states = nodes.map(function(node){
          var target = node.nodeValue;
          var set = /[一-鿿]/.test(target) ? CJK : LAT;
          var cur = target.split(''), locked = cur.map(function(ch){ return /\s/.test(ch); });
          for (var i = 0; i < cur.length; i++) { if (!locked[i]) cur[i] = set[(Math.random()*set.length)|0]; }
          node.nodeValue = cur.join('');
          return { node: node, target: target.split(''), cur: cur, locked: locked, set: set };
        });
        var raf = 0, last = 0;
        var tick = 55, ratio = Math.max(0.06, tick / (budgetMs || 700));
        function loop(now){
          if (now - last >= 1000/49 && !document.hidden) {
            states.forEach(function(s){
              for (var i = 0; i < s.cur.length; i++) {
                if (!s.locked[i] && !/\s/.test(s.target[i])) s.cur[i] = s.set[(Math.random()*s.set.length)|0];
              }
              s.node.nodeValue = s.cur.join('');
            });
            last = now;
          }
          raf = requestAnimationFrame(loop);
        }
        function lock(){
          var done = true;
          states.forEach(function(s){
            var cand = [];
            for (var i = 0; i < s.locked.length; i++) if (!s.locked[i]) cand.push(i);
            if (cand.length) {
              done = false;
              var take = Math.min(Math.max(1, Math.ceil(s.locked.length * ratio)), cand.length);
              for (var k = 0; k < take; k++) {
                var idx = cand.splice((Math.random()*cand.length)|0, 1)[0];
                s.cur[idx] = s.target[idx]; s.locked[idx] = true;
              }
              s.node.nodeValue = s.cur.join('');
            }
          });
          if (!done) setTimeout(lock, tick);
          else cancelAnimationFrame(raf);
        }
        raf = requestAnimationFrame(loop);
        setTimeout(lock, tick);
      }
      return { crack: crack };
    })();

    window.addEventListener('DOMContentLoaded', function(){
      Crack.crack(document.getElementById('intro'), 900);
    });

    /* ===== 資料拉取 ===== */
    let HEX_DB = null;
    let STAR_MAP = null;
    let PAIR_MAP = {};

    Promise.all([
      fetch('iching-data.json').then(r => r.json()).catch(() => null),
      fetch('28_xiu_j2000.json').then(r => r.json()).catch(() => null)
    ]).then(([hexData, starData]) => {
      if (hexData) { HEX_DB = hexData; buildIndex(); }
      if (starData) {
        STAR_MAP = {};
        starData.forEach(row => {
          STAR_MAP[String(row["中文名"]).replace(/宿$/, '')] = {
            name: row["英譯"] || "", RA: row["RA"] || "", DEC: row["DEC"] || ""
          };
        });
      }
    });

    const TRIGRAM_NAME = {"天":"乾","地":"坤","雷":"震","山":"艮","水":"坎","火":"離","風":"巽","澤":"兌"};
    const NUM_TO_TRIGRAM = {1:"乾",2:"兌",3:"離",4:"震",5:"巽",6:"坎",7:"艮",0:"坤"};
    const TRI_BITS = {
      "乾":[1,1,1],"兌":[1,1,0],"離":[1,0,1],"震":[1,0,0],
      "巽":[0,1,1],"坎":[0,1,0],"艮":[0,0,1],"坤":[0,0,0]
    };
    function bitsToTrig([a,b,c]){ for(const k in TRI_BITS){ const v=TRI_BITS[k]; if(v[0]===a&&v[1]===b&&v[2]===c) return k; } return null; }

    function parseUpperLower(title){
      const m = title.match(/([乾坤震艮坎離巽兌天地雷山水火風澤])([乾坤震艮坎離巽兌天地雷山水火風澤])?[為]/);
      if(m){ const ch=m[1]; const up=m[1] in TRIGRAM_NAME ? TRIGRAM_NAME[ch] : ch; return {up, down:up}; }
      const mm = title.match(/^([天地雷山水火風澤])([天地雷山水火風澤])/);
      if(mm){ const up=TRIGRAM_NAME[mm[1]]; const down=TRIGRAM_NAME[mm[2]]; return {up, down}; }
      let up="", down="";
      for(const k in TRIGRAM_NAME){ if(title.includes(k) && !up) up=TRIGRAM_NAME[k]; }
      for(const k in TRIGRAM_NAME){ if(title.lastIndexOf(k) > 0) down=TRIGRAM_NAME[k]; }
      return {up, down};
    }

    function buildIndex(){
      if(!HEX_DB) return;
      HEX_DB.hexagrams.forEach(h => {
        const {up, down} = parseUpperLower(h.gua);
        if(up && down) PAIR_MAP[`上:${up}|下:${down}`] = h;
      });
    }

    /* ===== 工具 ===== */
    const mod8 = g => ((g[0]*100 + g[1]*10 + g[2])%8 + 8)%8;

    function movingLinesFromNumber(g){
      let n = (g[0]*100 + g[1]*10 + g[2]);
      const toggled = new Set();
      while(n > 0){
        let r = n % 6; if(r === 0) r = 6;
        const idx = r - 1;
        if(toggled.has(idx)) toggled.delete(idx); else toggled.add(idx);
        n = Math.floor(n/6);
      }
      return Array.from(toggled).sort((a,b) => a-b);
    }

    function flipMany(bits, idxArr){
      const out = bits.slice();
      idxArr.forEach(i => out[i] = out[i] ? 0 : 1);
      return out;
    }

    function escapeHTML(s) { return (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

    /* ===== 數字鍵盤 ===== */
    const pad = document.getElementById('pad');
    const digitBtns = [...pad.querySelectorAll('.digit')];
    const startBtn = document.getElementById('start');

    function setDigit(btn, val){
      const v = (Number(val)||0)%10;
      btn.dataset.val = String(v);
      const span = btn.querySelector('.digit-num');
      if(span) span.textContent = String(v);
      btn.setAttribute('aria-label', `位 ${Number(btn.dataset.i)+1}：${v}`);
      btn.classList.remove('invalid','invalid-leading');
    }

    /* 手感：快速 scramble 三格再落定 */
    function tapDigit(btn){
      const next = ((Number(btn.dataset.val)||0) + 1) % 10;
      const span = btn.querySelector('.digit-num');
      btn.classList.add('tapped');
      let step = 0;
      (function jitter(){
        if (step < 3) {
          if (span) span.textContent = String((Math.random()*10)|0);
          step++;
          setTimeout(jitter, 28);
        } else {
          setDigit(btn, next);
          setTimeout(() => btn.classList.remove('tapped'), 120);
        }
      })();
    }

    digitBtns.forEach(b => setDigit(b, b.dataset.val || 0));

    pad.addEventListener('pointerdown', e => {
      const btn = e.target.closest('.digit'); if(!btn) return;
      e.preventDefault(); e.stopPropagation();
      setCursor(digitBtns.indexOf(btn));
      tapDigit(btn);
    }, {passive: false});

    /* ===== 鍵盤操作全機台 =====
       0-9 打字入管、← → 移游標、↑ ↓ 加減、Backspace 退格、
       Enter = CAST、C = COPY、Esc = 清零。 */
    let kbPos = 0;
    const KB_FINE = window.matchMedia('(hover:hover) and (pointer:fine)').matches;
    function setCursor(i){
      kbPos = Math.max(0, Math.min(digitBtns.length-1, i));
      digitBtns.forEach((b,k) => b.classList.toggle('cursor', KB_FINE && k===kbPos));
    }
    function hitCursor(){
      const b = digitBtns[kbPos]; if(!b) return;
      b.classList.add('hit');
      setTimeout(() => b.classList.remove('hit'), 150);
    }
    if(KB_FINE) setCursor(0);

    function kbBusy(){
      /* 選單／直聯面板開住嗰陣，鍵盤唔屬於機台 */
      return !!document.querySelector('.hk-menu.open, .hk-enq-panel.open, .hk-about.open');
    }
    document.addEventListener('keydown', e => {
      if(e.metaKey || e.ctrlKey || e.altKey) return;
      const t = e.target;
      if(t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
      if(kbBusy()) return;
      const k = e.key;

      if(/^[0-9]$/.test(k)){
        e.preventDefault();
        setDigit(digitBtns[kbPos], k);
        hitCursor();
        if(kbPos < digitBtns.length-1) setCursor(kbPos+1);
        return;
      }
      if(k === 'Backspace'){
        e.preventDefault();
        if(Number(digitBtns[kbPos].dataset.val) === 0 && kbPos > 0) setCursor(kbPos-1);
        setDigit(digitBtns[kbPos], 0); hitCursor();
        return;
      }
      if(k === 'ArrowLeft'){ e.preventDefault(); setCursor(kbPos-1); return; }
      if(k === 'ArrowRight'){ e.preventDefault(); setCursor(kbPos+1); return; }
      if(k === 'Home'){ e.preventDefault(); setCursor(0); return; }
      if(k === 'End'){ e.preventDefault(); setCursor(digitBtns.length-1); return; }
      if(k === 'ArrowUp' || k === 'ArrowDown'){
        e.preventDefault();
        const d = k === 'ArrowUp' ? 1 : 9;                 /* +1 / -1 (mod 10) */
        setDigit(digitBtns[kbPos], (Number(digitBtns[kbPos].dataset.val)||0) + d);
        hitCursor();
        return;
      }
      if(k === 'Enter'){ e.preventDefault(); onStart(e); return; }
      if(k === 'c' || k === 'C'){
        const cb = document.getElementById('copyBtn');
        if(cb && !cb.disabled){ e.preventDefault(); cb.click(); }
        return;
      }
      if(k === 'Escape'){
        e.preventDefault();
        digitBtns.forEach(b => setDigit(b, 0));
        setCursor(0); hitCursor();
        return;
      }
    });

    startBtn.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); onStart(e); }, {passive: false});
    startBtn.addEventListener('keydown', e => { if(e.key === 'Enter' || e.key === ' ') onStart(e); });

    function flashInvalid(el){
      el.classList.add('invalid');
      setTimeout(() => el.classList.remove('invalid'), 600);
    }
    let zeroWarnedOnce = false;
    function markLeadingRed(){ [0,3,6].forEach(i => digitBtns[i] && digitBtns[i].classList.add('invalid-leading')); }
    function clearLeadingRed(){ [0,3,6].forEach(i => digitBtns[i] && digitBtns[i].classList.remove('invalid-leading')); }
    function flashPad(){ pad.classList.add('flash'); setTimeout(() => pad.classList.remove('flash'), 600); }

    /* ===== 出卦 ===== */
    let scrambleRaf = 0;
    let LAST = null; // 供 copy 用

    function onStart(ev){
      if(!HEX_DB) { alert("卦辭矩陣同步中，請稍後。"); return; }

      const vals = digitBtns.map(d => Number(d.dataset.val)||0);
      const g1 = vals.slice(0,3), g2 = vals.slice(3,6), g3 = vals.slice(6,9);
      const firsts = [digitBtns[0], digitBtns[3], digitBtns[6]];
      let bad = false;
      [g1, g2, g3].forEach((g, idx) => { if(g[0] === 0) { bad = true; flashInvalid(firsts[idx]); } });

      if(bad){
        try{ (ev && ev.currentTarget && ev.currentTarget.blur) && ev.currentTarget.blur(); }catch(_){}
        /* 提示寫入資料框（唔再用 alert，免打斷儀器感） */
        const msg = document.getElementById('scrMsg');
        if(msg){
          msg.hidden = false;
          msg.textContent = '三組數字的首位皆不能為零。請修正。';
        }
        markLeadingRed(); flashPad(); setTimeout(clearLeadingRed, 800);
        return;
      }

      const remLow = mod8(g1), remUp = mod8(g2);
      const trigLow = NUM_TO_TRIGRAM[remLow], trigUp = NUM_TO_TRIGRAM[remUp];
      const mainHex = PAIR_MAP[`上:${trigUp}|下:${trigLow}`];
      if(!mainHex){ alert(`未能匹配卦：上卦 ${trigUp}、下卦 ${trigLow}。`); return; }

      const movingIdx = movingLinesFromNumber(g3);
      const mainBits = TRI_BITS[trigLow].concat(TRI_BITS[trigUp]);
      const changedBits = flipMany(mainBits, movingIdx);
      const changedHex = PAIR_MAP[`上:${bitsToTrig(changedBits.slice(3,6))}|下:${bitsToTrig(changedBits.slice(0,3))}`];

      const judge = buildJudgment({
        moveCount: movingIdx.length, movingIdx, mainHex, changedHex,
        M_YAO: mainHex.yao || [], C_YAO: changedHex ? (changedHex.yao || []) : []
      });

      LAST = { time: new Date(), input: [g1, g2, g3], mainHex, changedHex, mainBits, changedBits, movingIdx, judge };

      /* 數字坍縮 → 渲染 */
      cancelAnimationFrame(scrambleRaf);
      const digitsState = digitBtns.map(btn => ({
        btn, span: btn.querySelector('.digit-num'),
        duration: 200 + Math.random() * 200,
        totalJumps: Math.floor(Math.random() * 16) + 5,
        jumpCount: 0, lastJumpTime: performance.now(), done: false
      }));
      digitsState.forEach(s => s.interval = s.duration / s.totalJumps);
      let scrambleStart = null;
      function scrambleDigits(now){
        if(!scrambleStart){ scrambleStart = now; digitsState.forEach(s => s.lastJumpTime = now); }
        let allDone = true;
        digitsState.forEach(state => {
          if(state.done) return;
          allDone = false;
          if(now - scrambleStart >= state.duration || state.jumpCount >= state.totalJumps){
            setDigit(state.btn, 0); state.done = true;
          } else if(now - state.lastJumpTime >= state.interval && !document.hidden){
            if(state.span) state.span.textContent = Math.floor(Math.random()*10);
            state.lastJumpTime = now; state.jumpCount++;
          }
        });
        if(!allDone) scrambleRaf = requestAnimationFrame(scrambleDigits);
        else { cancelAnimationFrame(scrambleRaf); renderResult(); }
      }
      scrambleRaf = requestAnimationFrame(scrambleDigits);
    }

    /* ===== 渲染（圖形化） ===== */
    function starParts(hex){
      const xiu = hex?.extra?.['星宿'] || '';
      if(!xiu || !STAR_MAP) return null;
      const rec = STAR_MAP[String(xiu).replace(/宿$/, '')];
      return rec ? { xiu, rec } : null;
    }

    function buildLines(container, bits, movingIdx, isMain, hex){
      container.innerHTML = '';
      for (let i = 0; i < 6; i++) {
        const line = document.createElement('div');
        line.className = 'hline ' + (bits[i] ? 'yang' : 'yin');
        if (isMain && movingIdx.includes(i)) line.classList.add('moving');
        line.dataset.idx = i;
        line.dataset.which = isMain ? 'main' : 'changed';
        line.setAttribute('role', 'button');
        line.setAttribute('aria-label', ['初爻','二爻','三爻','四爻','五爻','上爻'][i]);
        if (bits[i]) {
          line.innerHTML = '<span class="seg"></span>';
        } else {
          line.innerHTML = '<span class="seg"></span><span class="seg"></span>';
        }
        container.appendChild(line);
      }
      /* 由下而上逐爻生成 */
      const lines = [...container.children];
      lines.forEach((ln, i) => setTimeout(() => ln.classList.add('show'), 80 + i * 110));
    }

    function metaText(hex){
      const ek = hex?.extra?.['卦氣'] || '';
      const es = hex?.extra?.['星宿'] || '';
      const parts = [];
      if (ek) parts.push(ek);            /* 只寫值：立春 */
      if (es) parts.push(es);            /* 只寫值：亢宿 */
      return parts.join('｜');
    }

    /* 未起卦前：>log 顯示最近三次記錄（點擊卦爻…一句下方），每卦帶 >copy */
    (function icHistory(){
      try {
        const hist = JSON.parse(localStorage.getItem('ic_hist') || '[]');
        if (!Array.isArray(hist) || !hist.length) return;
        const el = document.getElementById('icHist');
        el.textContent = '';
        const head = document.createElement('div');
        head.textContent = '>log';
        el.appendChild(head);
        hist.forEach(h => {
          const row = document.createElement('div');
          const line = h.d + '　' + h.m + (h.c ? ' → ' + h.c : '');
          const txt = document.createElement('span');
          txt.innerHTML = h.d + '　<b>' + h.m + '</b>' + (h.c ? ' → <b>' + h.c + '</b>' : '');
          row.appendChild(txt);
          const cp = document.createElement('button');
          cp.type = 'button';
          cp.className = 'ic-copy';
          cp.textContent = '>copy';
          cp.addEventListener('click', () => {
            const done = () => { cp.textContent = '>copied'; setTimeout(() => { cp.textContent = '>copy'; }, 1200); };
            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(line).then(done, done);
            } else {
              const ta = document.createElement('textarea');
              ta.value = line; document.body.appendChild(ta);
              ta.select(); try { document.execCommand('copy'); } catch (e) {}
              ta.remove(); done();
            }
          });
          row.appendChild(cp);
          el.appendChild(row);
        });
        el.hidden = false;
      } catch (e) {}
    })();

    let starDriftTimer = 0;

    function renderResult(){
      /* COPY：起卦後由暗轉亮一級；重新起卦重置（撳過嘅 done 亦清走） */
      (function(){
        const msg = document.getElementById('scrMsg');
        if(msg){ msg.hidden = true; msg.textContent = ''; }
        const cb = document.getElementById('copyBtn');
        if(cb){ cb.disabled=false; cb.classList.remove('done'); cb.classList.add('armed');
                cb.textContent='COPY'; }
      })();
      const R = document.getElementById('result');
      const intro = document.getElementById('intro');
      intro.hidden = true;
      R.hidden = false;
      R.classList.remove('on');
      closePop();

      const { mainHex, changedHex, mainBits, changedBits, movingIdx, judge } = LAST;

      buildLines(document.getElementById('linesMain'), mainBits, movingIdx, true, mainHex);
      buildLines(document.getElementById('linesChanged'), changedBits, movingIdx, false, changedHex);

      document.getElementById('nameMain').textContent = mainHex.gua || '';
      document.getElementById('metaMain').textContent = metaText(mainHex);
      document.getElementById('nameChanged').textContent = changedHex ? changedHex.gua : '（資料未配對）';
      document.getElementById('metaChanged').textContent = changedHex ? metaText(changedHex) : '';

      /* 記錄最近三卦（下次未起卦前顯示） */
      try {
        const hist = JSON.parse(localStorage.getItem('ic_hist') || '[]');
        const d = new Date();
        const ds = d.getFullYear() + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.' + String(d.getDate()).padStart(2, '0');
        hist.unshift({ d: ds, m: mainHex.gua || '', c: changedHex ? changedHex.gua : '' });
        localStorage.setItem('ic_hist', JSON.stringify(hist.slice(0, 3)));
      } catch (e) {}

      /* 星宿 RA/DEC（跟本卦） */
      const sp = starParts(mainHex);
      const starEl = document.getElementById('starLine');
      clearInterval(starDriftTimer);
      if (sp) {
        starEl.textContent = '';
        const nm = document.createElement('span');
        nm.className = 'sname';
        nm.textContent = '>' + sp.rec.name;
        starEl.appendChild(nm);
        const tn = document.createTextNode('RA ' + sp.rec.RA + ' | DEC ' + sp.rec.DEC + ' ');
        starEl.appendChild(tn);
        const sq = document.createElement('span');
        sq.className = 'blink-block'; sq.textContent = '■';
        starEl.appendChild(sq);
        /* 微量數字跳動 */
        const base = tn.nodeValue;
        starDriftTimer = setInterval(() => {
          if (document.hidden) return;
          const t = tn.nodeValue.split('');
          const idxs = [];
          for (let j = 0; j < t.length; j++) { if (t[j] >= '0' && t[j] <= '9') idxs.push(j); }
          if (!idxs.length) return;
          const p = idxs[(Math.random()*idxs.length)|0];
          t[p] = String((Math.random()*10)|0);
          tn.nodeValue = t.join('');
          /* 一半機會修正返原值，令佢喺真值附近震盪 */
          if (Math.random() < 0.55) setTimeout(() => {
            const c = tn.nodeValue.split(''); c[p] = base[p]; tn.nodeValue = c.join('');
          }, 90);
        }, 160);
      } else {
        starEl.textContent = '';
      }

      /* 卦名 + 卦氣星宿全部搬咗上斷方塊首行 */
      const jg = document.getElementById('jgua');
      if(jg){
        const row = (tag, hex, which) =>
          '<div class="jg-row"><b>' + tag + '</b>'
          + '<span class="g" data-which="' + which + '">' + escapeHTML(hex ? (hex.gua||'') : '（資料未配對）') + '</span>'
          + '<i>' + escapeHTML(hex ? metaText(hex) : '') + '</i></div>';
        jg.innerHTML = row('本', mainHex, 'main')
                     + (changedHex ? row('之', changedHex, 'chg') : '');
      }

      document.getElementById('jsum').textContent = judge.summary;
      document.getElementById('jlines').innerHTML = judge.lines.map(s => escapeHTML(s)).join('<br>');

      const btn = document.getElementById('copyBtn');
      btn.textContent = 'COPY';

      /* 文字浮現 + 解碼 */
      requestAnimationFrame(() => requestAnimationFrame(() => {
        R.classList.add('on');
        /* 舊版面嘅 .figs 已經冇咗，改 crack 而家真正存在嘅元素 */
        /* 只 crack #judge：.jgua 喺佢入面，分開 crack 會兩個動畫打架鎖死亂碼 */
        [['judge',700]].forEach(([id, ms]) => {
          const el = document.getElementById(id);
          if(el && el.textContent.trim()) Crack.crack(el, ms);
        });
      }));
    }

    /* ===== 爻辭 / 卦辭 彈出 ===== */
    const yaoPop = document.getElementById('yaoPop');
    const popVeil = document.getElementById('popVeil');
    const YAO_NAMES = ['初爻','二爻','三爻','四爻','五爻','上爻'];

    function openPop(label, text){
      document.getElementById('popLab').textContent = label;
      document.getElementById('popBody').textContent = text || '（無資料）';
      yaoPop.classList.add('open');
      popVeil.classList.add('on');
      yaoPop.setAttribute('aria-hidden', 'false');
      Crack.crack(document.getElementById('popBody'), 450);
    }
    function closePop(){
      yaoPop.classList.remove('open');
      popVeil.classList.remove('on');
      yaoPop.setAttribute('aria-hidden', 'true');
    }
    document.getElementById('popClose').addEventListener('click', closePop);
    popVeil.addEventListener('click', closePop);
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closePop(); });

    /* ── hover 爻爻詞 ── */
    const FINE_PTR = window.matchMedia('(hover:hover) and (pointer:fine)').matches;
    (function yaoHover(){
      /* 觸控唔行呢條路：pointermove 會令浮層黐住手指散唔去。觸控＝單點彈出。 */
      if(!FINE_PTR) return;
      const tip = document.getElementById('yaoTip');
      const R = document.querySelector('.scr-bay');   /* 卦爻喺屏區，唔喺 #result */
      if(!tip || !R) return;
      function hide(){ tip.classList.remove('on'); }
      function show(ln, x, y){
        if(!LAST) return;
        const idx = Number(ln.dataset.idx);
        const hex = ln.dataset.which === 'main' ? LAST.mainHex : LAST.changedHex;
        const txt = hex && (hex.yao || [])[idx];
        if(!txt){ hide(); return; }
        tip.innerHTML = '<b>' + (ln.dataset.which === 'main' ? 'PRIMARY' : 'TRANSFORMED')
                      + ' / ' + YAO_NAMES[idx] + '</b>' + escapeHTML(String(txt).trim());
        tip.classList.add('on');
        const r = tip.getBoundingClientRect();
        let px = x + 14, py = y - r.height - 10;
        if(px + r.width > innerWidth - 8) px = innerWidth - r.width - 8;
        if(py < 8) py = y + 16;
        tip.style.left = px + 'px'; tip.style.top = py + 'px';
      }
      R.addEventListener('pointermove', e => {
        const ln = e.target.closest('.hline');
        if(ln) show(ln, e.clientX, e.clientY); else hide();
      });
      R.addEventListener('pointerleave', hide);
      window.addEventListener('scroll', hide, true);
    })();

    document.querySelector('.scr-bay').addEventListener('click', e => {
      const ln = e.target.closest('.hline');
      if (ln && LAST) {
        const idx = Number(ln.dataset.idx);
        const hex = ln.dataset.which === 'main' ? LAST.mainHex : LAST.changedHex;
        if (!hex) return;
        const label = (ln.dataset.which === 'main' ? 'PRIMARY / ' : 'TRANSFORMED / ') + YAO_NAMES[idx];
        openPop(label, (hex.yao || [])[idx]);
        return;
      }
    });

    /* 卦名（斷方塊頂）→ 卦辭 */
    document.querySelector('.scr-wide').addEventListener('click', e => {
      const g = e.target.closest('.jgua .g');
      if (!g || !LAST) return;
      const isMain = g.dataset.which === 'main';
      const hex = isMain ? LAST.mainHex : LAST.changedHex;
      if (!hex) return;
      openPop((isMain ? 'PRIMARY / ' : 'TRANSFORMED / ') + '卦辭', hex.guaci);
    });

    /* ===== 一鍵複製（全卦記錄） ===== */
    function fullRecord(){
      if (!LAST) return '';
      const { time, input, mainHex, changedHex, movingIdx, judge } = LAST;
      const pad2 = n => String(n).padStart(2, '0');
      const ts = time.getFullYear() + '-' + pad2(time.getMonth()+1) + '-' + pad2(time.getDate()) +
                 ' ' + pad2(time.getHours()) + ':' + pad2(time.getMinutes());
      const nums = input.map(g => g.join('')).join(' | ');
      const yaoBlock = (hex, tag) => {
        if (!hex) return tag + '：（資料未配對）\n';
        let s = tag + '：' + hex.gua + '\n';
        const mt = metaText(hex); if (mt) s += mt + '\n';
        s += '卦辭：' + (hex.guaci || '') + '\n';
        (hex.yao || []).forEach((t, i) => {
          s += t + (tag === '本卦' && movingIdx.includes(i) ? ' ■' : '') + '\n';
        });
        return s;
      };
      let out = 'hikki iching — ' + ts + '\n';
      out += '輸入：' + nums + '\n\n';
      out += yaoBlock(mainHex, '本卦') + '\n';
      out += yaoBlock(changedHex, '變卦') + '\n';
      out += '斷：' + judge.summary + '\n';
      judge.lines.forEach(l => { out += l + '\n'; });
      out += '\nhikki.ca/iching ■';
      return out;
    }

    /* ===== 列印：出一份卦象紀錄 ===== */
    const YAOPOS = ['初','二','三','四','五','上'];
    window.hkPrintBody = function(){
      if(!LAST) return '<div class="ic-doc"><div class="none">NO CAST ON RECORD &mdash; '
                     + 'INSTRUMENT IDLE AT TIME OF PRINT.</div></div>';
      const L = LAST;
      const grp = g => g.join('');
      /* 六爻由下至上，用實線／斷線畫返出嚟 */
      const draw = (bits, moving) => bits.map((b,i) =>
        '<div class="l">' + YAOPOS[i] + '&nbsp; '
        + (b ? '&#9608;&#9608;&#9608;&#9608;&#9608;&#9608;&#9608;'
             : '&#9608;&#9608;&#9608;&nbsp;&nbsp;&#9608;&#9608;&#9608;')
        + (moving.indexOf(i) >= 0 ? ' &nbsp;&#9679;' : '') + '</div>'
      ).reverse().join('');
      const mv = L.movingIdx.length
        ? L.movingIdx.map(i => YAOPOS[i]).join('、')
        : 'NONE';
      let h = '<div class="ic-doc">';
      h += '<div class="r"><b>INPUT</b><span>' + grp(L.input[0]) + ' / ' + grp(L.input[1])
         + ' / ' + grp(L.input[2]) + '</span></div>';
      h += '<div class="r"><b>CAST AT</b><span>' + L.time.toISOString().replace('T',' ').slice(0,19) + 'Z</span></div>';
      h += '<div class="r"><b>PRIMARY</b><span class="cjk">' + escapeHTML(L.mainHex.gua) + '</span></div>';
      if(L.changedHex) h += '<div class="r"><b>TRANSFORMED</b><span class="cjk">' + escapeHTML(L.changedHex.gua) + '</span></div>';
      h += '<div class="r"><b>MOVING</b><span>' + mv + '</span></div>';
      const ex = L.mainHex.extra || {};
      if(ex['星宿'] || ex['卦氣'])
        h += '<div class="r"><b>星宿 / 卦氣</b><span class="cjk">'
           + escapeHTML([ex['星宿'], ex['卦氣']].filter(Boolean).join(' · ')) + '</span></div>';
      h += '<div class="r"><b>卦辭</b><span class="cjk">' + escapeHTML(L.mainHex.guaci || '') + '</span></div>';
      h += '<div class="hx">' + draw(L.mainBits, L.movingIdx) + '</div>';
      h += '<div class="jd"><b>斷</b>　' + escapeHTML(L.judge.summary) + '<br>'
         + L.judge.lines.map(escapeHTML).join('<br>') + '</div>';
      h += '</div>';
      return h;
    };

    document.getElementById('copyBtn').addEventListener('click', function(){
      const txt = fullRecord();
      const btn = this;
      const ok = () => {
        btn.classList.add('done');                 /* 撳過＝再亮一級 */
        btn.textContent = 'COPIED';
        setTimeout(() => { btn.textContent = 'COPY'; }, 2000);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(txt).then(ok).catch(() => fallbackCopy(txt, ok));
      } else {
        fallbackCopy(txt, ok);
      }
    });
    function fallbackCopy(txt, ok){
      const ta = document.createElement('textarea');
      ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); ok(); } catch(_) {}
      ta.remove();
    }

    /* ===== 斷卦法（朱熹） ===== */
    function buildJudgment({moveCount, movingIdx, mainHex, changedHex, M_YAO, C_YAO}){
      const idxToName = i => ['初爻','二爻','三爻','四爻','五爻','上爻'][i] || (`第${i+1}爻`);
      const upDown = i => i >= 3 ? '（上卦）' : '（下卦）';
      const lines = [];
      let summary = '';

      if (moveCount === 0){
        summary = '六爻不變，用本卦卦辭。';
        lines.push(mainHex.guaci || '');
      } else if (moveCount === 1){
        const i = movingIdx[0];
        summary = `一爻變，用本卦${idxToName(i)}爻辭。`;
        lines.push(M_YAO[i] || '');
      } else if (moveCount === 2){
        const a = movingIdx[0], b = movingIdx[1];
        const top = Math.max(a,b), low = Math.min(a,b);
        summary = '兩爻變，用本卦兩變爻辭，上者為主。';
        lines.push(`${idxToName(top)}${upDown(top)}：${(M_YAO[top]||'').trim()}`);
        lines.push(`${idxToName(low)}${upDown(low)}：${(M_YAO[low]||'').trim()}`);
      } else if (moveCount === 3){
        summary = '三爻變，本卦卦辭為「貞」（體），變卦卦辭為「悔」（用）。';
        lines.push(`貞：${(mainHex.guaci||'').trim()}`);
        if (changedHex) lines.push(`悔：${(changedHex.guaci||'').trim()}`);
      } else if (moveCount === 4){
        summary = '四爻變，用變卦兩個「不變爻」之爻辭，下者為主。';
        const notChanged = [0,1,2,3,4,5].filter(i => !movingIdx.includes(i));
        const low = Math.min(...notChanged), high = Math.max(...notChanged);
        if (changedHex){
          lines.push(`${idxToName(low)}${upDown(low)}：${(C_YAO[low]||'').trim()}`);
          lines.push(`${idxToName(high)}${upDown(high)}：${(C_YAO[high]||'').trim()}`);
        }
      } else if (moveCount === 5){
        summary = '五爻變，用變卦唯一「不變爻」之爻辭。';
        const only = [0,1,2,3,4,5].find(i => !movingIdx.includes(i));
        if (changedHex) lines.push(`${idxToName(only)}${upDown(only)}：${(C_YAO[only]||'').trim()}`);
      } else if (moveCount === 6){
        if (changedHex){
          const isQian = /乾/.test(changedHex.gua);
          const isKun  = /坤/.test(changedHex.gua);
          let used = '';
          if ((isQian || isKun) && (changedHex.yao||[]).length >= 7){
            used = changedHex.yao[6] || changedHex.guaci || '';
            summary = `六爻全變，${isQian?'乾':'坤'}取「用」辭。`;
          }else{
            used = changedHex.guaci || '';
            summary = '六爻全變，用變卦卦辭。';
          }
          lines.push(used.trim());
        }else{
          summary = '六爻全變（變卦缺資料）。';
        }
      }
      return {summary, lines};
    }

    /* ===== 行動裝置：關閉手勢縮放 & 雙擊縮放 ===== */
    (function(){
      window.addEventListener('gesturestart', function(e){ e.preventDefault(); }, {passive:false});
      let lastTouch = 0;
      window.addEventListener('touchend', function(e){
        if (e.target.closest('#pad') || e.target.closest('#start')) return;
        const now = Date.now();
        if(now - lastTouch <= 300){ e.preventDefault(); }
        lastTouch = now;
      }, {passive:false});
    })();
  </script>
</body>
</html>
